name: Self-host images

# Builds the two Docker images a self-hoster actually runs, and drives one
# request through the tenant container (AGL-2433).
#
# ## Why this workflow exists
#
# Nothing in this repository has ever built `docker/console.Dockerfile` or
# `docker/tenant.Dockerfile`. Not nx-ci.yml, not tools-guards.yml, not a
# release job — `grep -rl docker .github/workflows` returned nothing at all.
# The self-host distribution is the one shipped artefact with no build signal,
# and every defect in it has been found by a person reading files rather than
# by a machine running them:
#
#  - AGL-2177  the tenant container served no site and 307'd every visitor to
#              Aglyn's console. Found by hand-driving the middleware.
#  - AGL-2221  AGLYN_STANDALONE was set only in the build stage, so AGL-2177's
#              fix was inert in every shipped container. Found by reading.
#  - AGL-2423  the deps stage did not copy `.npmrc`, so `npm ci` exited EUSAGE
#              and NO self-hoster could build either image at all. Found by
#              finally running `docker compose up --build`.
#
# AGL-2423 settles the argument: a first-line, total, reproducible failure that
# a build job catches in two minutes, sitting on `main` because no build job
# existed. Review cannot catch it — the Dockerfile reads correctly, and the
# file it omits is invisible precisely because a developer's own `npm ci`
# always finds it in the working directory.
#
# ## Why it also starts a container
#
# Building proves the images compile. It does not prove the container serves
# anything, which is what AGL-2177 and AGL-2221 actually broke. So the tenant
# image is started and asked for a host under the operator's configured apex,
# and the answer must not be a redirect to a console — the precise response
# both issues produced. No Firebase is involved on purpose: host resolution
# happens in middleware, ahead of any data read, so the assertion holds with no
# project and no credentials.
#
# ## Placeholder configuration, never secrets
#
# `tools/scripts/selfhost-ci-env.mjs` fills `.env.selfhost.example` with an
# imaginary operator's values. That is not a way around a secret — it is the
# point. The images must build for someone who has none of Aglyn's
# configuration, so inventing that person is the test.

on:
  push:
      # Sept-1 freeze (decided): the push trigger moved from `main`
      # to `production`. With many agents landing on `main` continuously this
      # workflow was running dozens of times an hour and every red notified
      # him, so CI became noise rather than signal. It is a RELEASE gate until
      # launch, and the promotion PR still runs `pull_request` below.
      #
      # ⚠️ `tools/gate.sh` DOES NOT COVER THIS (AGL-2014). Its phases are
      # `typecheck,lint,guards,test,build`, and `build` is `nx build --prod`,
      # not `docker compose build`; `grep -in docker tools/gate.sh` returns
      # nothing. AGL-2423 was a Dockerfile-only break that `nx build` cannot
      # see, so the gate is not a substitute for this job.
      #
      # The residual gap the path filters leave: the images build the WHOLE
      # app, but `apps/**` (bar one next.config.js) and `libs/**` are not
      # trigger paths. A source change there can break the image build and
      # neither the `production` push nor the promotion PR will fire this job.
      # RESTORE `main` AFTER LAUNCH — until then a break can sit on `main`
      # unnoticed until someone dispatches this workflow by hand.
    branches: [production]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.env.selfhost.example'
      - 'apps/tenant/next.config.js'
      - 'tools/scripts/selfhost-ci-env.mjs'
      - '.github/workflows/selfhost-images.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.env.selfhost.example'
      - 'apps/tenant/next.config.js'
      - 'tools/scripts/selfhost-ci-env.mjs'
      - '.github/workflows/selfhost-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selfhost-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build both images and serve one request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'

    steps:
      - uses: actions/checkout@v7

      # No `docker/setup-buildx-action`: this repository's Actions policy is
      # `allowed_actions: selected` with `verified_allowed: false` and only
      # `nrwl/*` permitted alongside GitHub-owned ones, so a `docker/*` action
      # makes the whole run a `startup_failure` with no jobs and no log — which
      # is how this was found. It is not needed either: BuildKit is the default
      # builder on `ubuntu-latest`, and compose v2 uses it, which is what the
      # `--secret` mount requires. The variable below states that rather than
      # relying on it.

      - name: Synthesise an operator's env file
        run: node tools/scripts/selfhost-ci-env.mjs

      - name: Build both images, with the command the runbook gives
        run: docker compose build

      - name: The tenant container serves its own apex instead of redirecting
        run: |
          set -euo pipefail
          # `docker compose up`, never `docker run --env-file`: only compose
          # strips the quotes around a value, and FIREBASE_PRIVATE_KEY has to be
          # quoted in the file (AGL-2443). This is also simply the command the
          # runbook gives, which is the command that should be under test.
          docker compose up -d tenant

          # `up -d` returns when the container is STARTED, which is not when the
          # Next.js server inside it is serving. Two warm-ups sit between those
          # two moments and the request under test pays for both:
          #
          #  - the standalone server has to boot and bind :4500;
          #  - the middleware `await`s a lockdown verdict from this same
          #    container's own `/api/lockdown-verdict` (AGL-1501) with no
          #    timeout of its own, and memoizes it PER RESOLVED TENANT HOST.
          #    Against placeholder Firebase the first fetch for a cold host has
          #    no bound on how long it takes to fail.
          #
          # So the wait is driven with the EXACT request the assertions make. A
          # probe on a different `Host` resolves to a different tenant host, so
          # it warms a different memo entry and proves nothing about this one; a
          # probe on the bare port proves only that something accepted a socket.
          #
          # It asks ONLY whether a response arrived, never what the response
          # said. A tenant that redirects its own apex — the AGL-2177 failure —
          # answers this probe immediately and is then failed by the assertions
          # below, which is the order that has to hold. Reading the status here
          # would spin on that regression until the budget ran out and report it
          # as a readiness timeout.
          probe() {
            curl -sS -o /dev/null -m 10 \
              -H 'Host: acme.sites.example.com' http://127.0.0.1:4500/ 2>/dev/null
          }
          ready=no
          attempts=0
          reason='no attempt completed'
          started=$(date +%s)
          deadline=$((started + 300))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempts=$((attempts + 1))
            rc=0
            probe || rc=$?
            if [ "$rc" -eq 0 ]; then
              ready=yes
              break
            fi
            # curl's own codes separate "nothing is listening" from "listening
            # but not answering", which are different container faults and are
            # worth telling apart in the failure message.
            case "$rc" in
              7) reason='connection refused, nothing is listening on :4500' ;;
              28) reason='connected, but no response within 10s' ;;
              *) reason="curl exited $rc" ;;
            esac
            sleep 2
          done
          waited=$(( $(date +%s) - started ))

          # A container that never serves must FAIL this step, not slip past it:
          # every assertion below is about the response, and no response is not
          # a passing one. The wording matters as much as the exit — this is the
          # image failing to serve at all, which is a different defect from the
          # image serving and routing wrongly.
          if [ "$ready" != "yes" ]; then
            docker compose logs tenant || true
            echo "::error::the tenant container never became ready: $attempts attempts over ${waited}s, last failure: $reason. The routing assertions never ran."
            exit 1
          fi
          echo "tenant ready after $attempts attempt(s) in ${waited}s"

          # ONE request, read three ways. The server is warm, so the routing
          # answer is deterministic and this is asked exactly once: retrying an
          # assertion could only turn a real regression green.
          headers=$(mktemp)
          rc=0
          summary=$(curl -s -o /dev/null -D "$headers" \
            -w '%{http_code} %{redirect_url}' -m 30 \
            -H 'Host: acme.sites.example.com' http://127.0.0.1:4500/) || rc=$?
          if [ "$rc" -ne 0 ]; then
            docker compose logs tenant || true
            echo "::error::the tenant answered the readiness probe and then failed to answer the assertion request (curl exit $rc)."
            exit 1
          fi
          code=${summary%% *}
          location=${summary#* }
          # Resolved through the apex the rewrite is the bare subdomain,
          # `/acme/`; fallen through to the custom-domain branch it is
          # `/cname--acme.sites.example.com/`.
          rewrite=$(tr -d '\r' < "$headers" |
            awk 'tolower($1) == "x-middleware-rewrite:" { print $2 }')
          echo "status=$code location=${location:-<none>} x-middleware-rewrite=${rewrite:-<none>}"
          docker compose logs tenant || true

          # Aglyn's own host in the redirect is the sharpest form of the
          # failure and is named separately, because "self-host deployment
          # sends its visitors to us" is a different sentence from "redirected".
          case "${location:-}" in
            *aglyn.com*|*aglyn.app*|*aglyn.io*)
              echo "::error::the tenant sent a request for its OWN apex to an Aglyn host ($location) — AGL-2177: host resolution matched nothing and fell through."
              exit 1
              ;;
          esac

          # Any redirect at all for a host under the configured apex means the
          # host-resolution branch did not match. A 404 or a 500 does not: those
          # mean the request got past middleware and into a project that has no
          # such site, which is the correct outcome for placeholder Firebase.
          case "$code" in
            30[1278])
              echo "::error::the tenant redirected ($code → ${location:-unknown}) a request for a host under its own AGLYN_TENANT_HOST_CNAME apex instead of resolving it to a site."
              exit 1
              ;;
          esac

          # The status alone is too weak, and this was measured rather than
          # assumed: with placeholder Firebase, a host the apex branch resolves
          # and a host that falls through to the custom-domain branch BOTH
          # answer 404. A check that only reads the status cannot tell them
          # apart, which is a check that certifies its own subject.
          # `x-middleware-rewrite` can.
          case "${rewrite:-}" in
            /acme/*|/acme)
              ;;
            '')
              echo "::error::no x-middleware-rewrite on a request for the operator's own apex — middleware did not route it at all."
              exit 1
              ;;
            *)
              echo "::error::a host under the operator's own AGLYN_TENANT_HOST_CNAME apex was routed as '${rewrite}' instead of to the site 'acme'. Anything of the form /cname--… means the apex branch matched nothing and the request fell through to the custom-domain path (AGL-2177/AGL-2424)."
              exit 1
              ;;
          esac

      - name: Stop the smoke container
        if: always()
        run: docker compose down || true
