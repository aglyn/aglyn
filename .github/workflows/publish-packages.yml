name: Publish packages

# Every `libs/**` project is an npm package (docs/PACKAGES.md), and this is
# what puts them on the registry (AGL-3201).
#
# ---------------------------------------------------------------------------
# WHEN
# ---------------------------------------------------------------------------
# On the push to `production`, which is a promotion: the version every package
# carries was written by `release:prepare` for that release, so the promoted
# sha is the one moment the repo and the registry can be made to agree. It can
# also be run by hand — as a dry run, which is the default, or for real.
#
# `@aglyn/cli` keeps a version of its own and rides the same run: it goes out
# whenever its version is one the registry has not seen.
#
# ---------------------------------------------------------------------------
# WHY A SECOND RUN IS SAFE
# ---------------------------------------------------------------------------
# `publish-packages.mjs` publishes what the registry is MISSING and skips the
# rest, so a promotion that changed no lib publishes nothing, and a run that
# died part way is finished by running it again. It builds and checks every
# package before it publishes the first, because a published version cannot be
# replaced.
#
# ---------------------------------------------------------------------------
# HOW THE REGISTRY KNOWS IT IS US (AGL-3201)
# ---------------------------------------------------------------------------
# TRUSTED PUBLISHING, first. npm mints nothing long-lived: GitHub issues this
# one run an OIDC token, npm checks it against the trusted publisher each
# package names — this repository, this workflow file — and takes the release.
# `id-token: write` is what lets GitHub issue it. Provenance comes with it for
# free: npm generates the attestation itself, which is what lets anyone check
# that a version on the registry was built from the commit it claims.
#
# Trust is configured PER PACKAGE and there are 51. `npm run trust:packages`
# lists what each one trusts today, and the owner configures the rest with
# `-- --set`; it is their account's security setting, so an agent may run the
# listing and never the change.
#
# THERE IS NO TOKEN ANY MORE. All 51 packages name this workflow as a trusted
# publisher, each with `createPackage` — the permission a plain `npm publish`
# needs, as distinct from the staged-publish one a configuration made after
# 2026-09-03 gets by default. Verified package by package on 2026-09-21, which
# is what let `NPM_TOKEN` go.
#
# The token it replaced was granular with the 2FA bypass and expired
# 2026-12-19; npm removes direct publishing with those in January 2027. A
# secret that no longer exists cannot expire, leak or be rotated into a broken
# release, which is the whole point of the change.

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real. Off is a dry run that builds and packs everything and publishes nothing.'
        type: boolean
        default: false
      only:
        description: 'Comma-separated package names to limit the run to (empty = every package).'
        type: string
        default: ''

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Trusted publishing needs npm 11.5.1 (AGL-3201). An older one does not
      # look for the OIDC token at all — it simply falls through to the token
      # and publishes, so the run goes GREEN having used the credential this
      # workflow exists to stop using, and the day that token expires is the
      # day anyone finds out. Asserted rather than assumed: the npm here is
      # whatever Node ships, which moves without this repository.
      - name: npm is new enough to use trusted publishing
        run: |
          have=$(npm --version)
          want=11.5.1
          if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" != "$want" ]; then
            echo "::error::npm $have cannot use trusted publishing; $want or later can. Raise .nvmrc, or install npm@$want in this job."
            exit 1
          fi
          echo "npm $have"

      - name: Publish what the registry is missing
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          ONLY: ${{ inputs.only }}
        run: |
          args=()
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          node tools/scripts/publish-packages.mjs "${args[@]}"
