name: NX CI

on:
  push:
    branches:
      - main
  pull_request:

# The Nx Cloud org is disabled (free-plan quota); with an access token
# present, nx hard-fails CI at authorization before running any task.
env:
  NX_NO_CLOUD: 'true'

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      # Native TypeScript 7 compiler; whole-workspace check runs in seconds
      # and is the only type gate (builds transpile with swc, no type-check).
      - run: npm run typecheck

      # Self-test the local ESLint guard rules (not part of the nx graph, so
      # run explicitly on every CI run — never affected-scoped).
      - run: npm run test:eslint-rules
      # The sandbox CSP the plugin origin actually serves (AGL-1092). Its
      # deployment is not an nx project, so nx affected never covers it.
      - run: npm run test:plugin-loader
      # The retired-colour detector (AGL-1431). Only the PURE half runs here —
      # the census itself measures production and lives in its own scheduled
      # workflow, because the regression it hunts arrives as authored content
      # with no commit and CI has nothing to be affected by. What CI can do is
      # keep the detector honest: it must still report all 176 occurrences on
      # a page that has them, rather than the 6 distinct rules emotion leaves.
      - run: npm run test:retired-colours
      # The dev-loop disk preflight (AGL-1425). This one can FAIL a serve
      # target, so a bug in its threshold parsing breaks every dev server in
      # the repo at once — and the fs call it guards cannot be exercised in
      # CI, where free space is whatever the runner happens to have. Only the
      # pure decision half is tested, and that is the half that decides.
      - run: npm run test:disk-space

      # apps/*/tsconfig.next.json are GENERATED from tsconfig.base.json, and
      # the typecheck above skips them by name — correctly, since they exist
      # for next.config's `typescript.tsconfigPath` rather than the native
      # compiler. That leaves nothing able to notice when they go stale, and
      # they did (AGL-1069): a `paths` entry was added to the base config,
      # the generator was never re-run, and three apps quietly resolved
      # nothing for that alias. Explicit and never affected-scoped for the
      # same reason as the step above — the input that invalidates these is
      # tsconfig.base.json, which is no app's source.
      - run: npm run sync:next-tsconfigs:check

      # Same shape: apps/console/constants/docs-help.generated.ts and the
      # besigner subset are generated from apps/docs frontmatter, and go
      # stale when a docs page gains a heading or changes its description.
      # The script has advertised itself as a CI gate since AGL-602 and was
      # never actually wired to one — written, documented, zero callers
      # (`feedback_verify_control_is_wired`). Affected-scoping is wrong here
      # too: the input is apps/docs, the outputs are in console and a
      # besigner lib.
      - run: npm run generate:docs-help:check

      # Revenue-truth guard (AGL-1070): org.plan is NOT revenue — a staff
      # override sets `plan` and writes no `subscription`, and three of four
      # production orgs are in that state, so summing PLAN_PRICING[org.plan]
      # overstates MRR 4x. The spec scans apps/** and libs/**, which makes its
      # invalidating input ANY project rather than the console it happens to
      # live in. Affected-scoping it is wrong for the same reason as the three
      # steps above: a new MRR surface landing in apps/www would not mark
      # console affected, and the guard would sit out the one commit it exists
      # to catch.
      - run: npx jest --config apps/console/jest.config.ts --rootDir apps/console --testPathPatterns revenue-truth

      # App Router graph boundary (AGL-1350). Same shape again: the walk
      # covers every app's routes and every lib they reach, so its invalidating
      # input is the whole workspace rather than the console it is filed under
      # — a tenant route or a plugin lib crossing the line would not mark
      # console affected. It is also the ONE class here that a green typecheck
      # and a green test suite both miss by construction: AGL-1349 took main
      # down with 141/141 clean, because only `nx build` sees a module graph.
      # Cheap enough (~1s) to run unconditionally, and it fails long before
      # the build step below would.
      - run: npm run check:app-router-graph

      - run: npx nx affected -t lint test build --parallel=3
