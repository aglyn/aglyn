name: NX CI

on:
  push:
    branches:
      # Sept-1 freeze (decided): the push trigger moved from `main`
      # to `production`. With many agents landing on `main` continuously this
      # workflow was running dozens of times an hour and every red notified
      # him, so CI became noise rather than signal. It is a RELEASE gate until
      # launch: `main` is verified before promotion by `tools/gate.sh`
      # (AGL-2090), and the promotion PR still runs `pull_request` below.
      # RESTORE `main` AFTER LAUNCH — until then a break can sit on `main`
      # unnoticed until someone runs the gate.
      - production
  pull_request:

# AGL-2378. A push (now `production` only — see the trigger above) is grouped
# by its own COMMIT, so pushes never
# contend and no commit is left without a verdict — this workflow is the only
# home of `typecheck`, `docs:typecheck`, the three generated-artifact gates,
# the revenue-truth spec, `check:app-router-graph` and `nx affected`, so a
# discarded run here is coverage nobody else supplies.
#
# Only pull_request runs supersede each other, where superseding is what you
# want: nobody reads the verdict on a PR's superseded tree.
#
# This workflow previously had no concurrency block at all, which gave main
# the right behaviour by accident and gave PRs the wrong one. Stating it makes
# the main-branch guarantee survive somebody later adding a group to throttle
# PRs. The main-branch cost is real and is accepted: 12 runs were in flight
# simultaneously on 2026-08-19, none of them queued, so the runners absorb it.
concurrency:
  group: nx-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# The Nx Cloud org is disabled (free-plan quota); with an access token
# present, nx hard-fails CI at authorization before running any task.
env:
  NX_NO_CLOUD: 'true'

jobs:
  main:
    runs-on: ubuntu-latest

    # AGL-2378. This was the only verdict-producing workflow with no timeout,
    # so a stuck run fell through to GitHub's 6-HOUR default and every later
    # push sat behind it. That is not hypothetical: until 947100c2c a
    # `console:test` spec looped through microtasks forever, which jest's
    # `testTimeout` structurally cannot catch — it is a real timer and the loop
    # never yields to the macrotask queue. On 2026-08-19, 25 runs reached
    # `nx affected` and took a median of 54.4m and a maximum of 75.8m, with the
    # `nx affected` step alone measured at 34.6m in one of them. That, not a
    # missing concurrency group, is most of what put 23 NX CI runs in flight at
    # once and made the workflow read as "constantly failing" when many of
    # those runs simply never got to answer.
    #
    # 60, and the first number here was WRONG — recorded so nobody re-derives
    # it from the same bad sample. It was set to 30 on the reasoning that 9.9m
    # (947100c2c, the first run to complete after the hang fix) was the slowest
    # completing run. That sample was one narrowly-affected commit. `nx affected`
    # scope dominates the runtime, and the real spread measured over the
    # following hour was 7.8m to 32.8m — `0585f3df1` and `96fe2d2a` both
    # completed at 32.8m, and `d0512575d` ran past 32.7m. The 30m bound then did
    # exactly what a too-tight bound does: it cancelled run 32266221225 at
    # 15:18:30, thirty minutes to the second after its job started, on a run
    # whose siblings finished honestly at 32.8m.
    #
    # That is worse than no bound at all. An unbounded stuck run is one obvious
    # red; a bound below the real distribution turns every honest slow run into
    # a cancellation, which is indistinguishable from the AGL-2378 eviction bug
    # this file was just fixed for and reads as "NX CI is constantly failing".
    #
    # 60 is ~1.8x the slowest observed completion (32.8m), still 6x under
    # GitHub's 6-hour default, and still bounds a genuine hang — the AGL-2374
    # hang band ran 22-76m with a 54.4m median.
    #
    # The hang is fixed, so this is a backstop against the NEXT one rather than
    # a live fire. If a legitimately wide commit — one touching tsconfig.base
    # or the root package.json, where `nx affected` approaches all 40 projects
    # — ever trips this, RAISE the number; measure the spread first rather than
    # trusting a single fast run, which is the mistake above. Do not remove it:
    # unbounded is how one stuck spec starves the branch for six hours.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # cloud/functions is a SEPARATE npm package, not a workspace of the root
      # one — the root package.json has no `workspaces` key and its postinstall
      # is only patch-package, so the `npm ci` above installs nothing for it.
      # tools/scripts/typecheck.mjs nonetheless walks cloud/functions/tsconfig
      # (`cloud/` is in neither its SKIP nor its PRUNE list), so without this
      # the typecheck step below fails with three TS2307s on firebase-functions
      # subpaths — a missing-install artifact, not a source defect (AGL-1776).
      # It goes unnoticed locally because every dev checkout has a nested
      # install left over from a past `firebase deploy`.
      #
      # Installing is deliberately preferred over adding `cloud/` to that
      # script's SKIP list: the Cloud Functions are a production surface, and
      # skipping would silently drop them from the workspace's ONLY type gate
      # to make a red go away.
      - run: npm ci --prefix cloud/functions

      # apps/docs is the SECOND such package, and it breaks a different step:
      # `docs` is an nx project whose build target shells `docusaurus build`,
      # so the `nx affected -t lint test build` at the bottom of this file
      # fails with `sh: docusaurus: command not found` on a root-only install
      # (AGL-1781). Same invisibility as above — every dev checkout has
      # apps/docs/node_modules from a past docs build.
      #
      # It stays standalone rather than becoming an npm workspace, and that is
      # not inertia: apps/docs/package.json pins React 18 and says in its own
      # description that its node_modules are self-contained so they never
      # collide with the root's React 19. Hoisting it is the one change that
      # would break it. cloud/functions is standalone for its own reason —
      # `firebase deploy` packs and uploads that directory as a self-contained
      # package. A `workspaces` key would move both problems, not solve them.
      #
      # So the policy is: standalone packages are enumerated here, and the
      # guard two steps below fails when a THIRD one lands without a line of
      # its own — which is the part that stops this recurring, since neither
      # of the first two was visible until CI (or a hand-run gate) hit it.
      - run: npm ci --prefix apps/docs

      - uses: nrwl/nx-set-shas@v5

      # Native TypeScript 7 compiler; whole-workspace check runs in seconds
      # and is the only type gate (builds transpile with swc, no type-check).
      - run: npm run typecheck

      # apps/docs is EXCLUDED from the sweep above by name
      # (tools/scripts/typecheck.mjs) because it is a standalone package with
      # its own TypeScript, and nothing ran its own target instead — so the
      # app had a `typecheck` script that had never once executed. It could
      # not have: apps/docs/tsconfig.json set `ignoreDeprecations: "6.0"`, a
      # value its TypeScript 5.6 rejects, so the command exited 2 before
      # compiling a file. Restoring it surfaced a real error it had been
      # hiding (AGL-2124). Explicit and never affected-scoped, matching the
      # generated-artifact gates below: the exclusion is by package, not by
      # what changed.
      - run: npx nx run docs:typecheck

      # Self-test the local ESLint guard rules (not part of the nx graph, so
      # run explicitly on every CI run — never affected-scoped).
      - run: npm run test:eslint-rules
      # The sandbox CSP the plugin origin actually serves (AGL-1092). Its
      # deployment is not an nx project, so nx affected never covers it.
      - run: npm run test:plugin-loader
      # The retired-colour detector (AGL-1431). Only the PURE half runs here —
      # the census itself measures production and lives in its own scheduled
      # workflow, because the regression it hunts arrives as authored content
      # with no commit and CI has nothing to be affected by. What CI can do is
      # keep the detector honest: on a fixture built from the shape /pricing
      # actually delivered it must report every occurrence — 164 in that
      # fixture — rather than deduping to the single distinct rule emotion
      # leaves, which is how the live 176 read as 6 and stayed invisible.
      - run: npm run test:retired-colours
      # The dev-loop disk preflight (AGL-1425). This one can FAIL a serve
      # target, so a bug in its threshold parsing breaks every dev server in
      # the repo at once — and the fs call it guards cannot be exercised in
      # CI, where free space is whatever the runner happens to have. Only the
      # pure decision half is tested, and that is the half that decides.
      - run: npm run test:disk-space
      # Three more tools/ self-tests that ran in NO workflow at all until
      # AGL-1778 — dark permanently, not for the 39 days nx-ci.yml itself was
      # switched off, because nothing had ever referenced them. Same never-
      # affected-scoped argument as every step above: tools/ is not an nx
      # project, so `nx affected` cannot reach it however the graph moves.
      #
      # The clean-deploy-source guard decides what gets shipped, and the
      # org-erase CLI decides what gets destroyed; both were guarding a path
      # while themselves unguarded.
      - run: npm run test:deploy-guard
      - run: npm run test:erase-cli
      # The contentSha256 backfill decides what gets REWRITTEN on real
      # customer media. Its rules are the reason it is safe to run at all —
      # `contentHash` untouched, additive only, gated behind --confirm — so
      # they are asserted here rather than trusted (AGL-1630).
      - run: npm run test:media-sha256-backfill
      # The SSO attestation backfill writes the one field that lets a domain
      # be published WITHOUT DNS proof, so a careless run routes another
      # company's sign-ins to the wrong IdP. Its refusals — a domain another
      # org already routes, a missing attester, --apply without the project
      # id typed out — are the only thing standing between the two, so they
      # are asserted rather than trusted (AGL-1887).
      - run: npm run test:sso-attestation
      # Also run in rules-drift.yml and index-drift.yml. This workflow is
      # ACTIVE and runs it too; an older comment here claimed it was
      # `disabled_manually`, which was false (AGL-2381). Kept in all three on
      # purpose: the suite asserts, at the DECLARATION, that rules-drift.yml
      # still invokes the checker and this self-test. Asserted only from
      # inside rules-drift.yml that claim is circular — delete the step and
      # the assertion stops running with it. Run from a second workflow it
      # becomes a real check on the first.
      - run: npm run test:rules-drift
      # The standalone-install guard and its own self-test (AGL-1781): the two
      # `npm ci --prefix` lines above are the whole of the policy, and nothing
      # made them keep up with the tree. Both packages they cover produced a
      # red that read as a source defect; a third would too. Cheap, pure node,
      # and it runs BEFORE the heavy steps it protects.
      - run: npm run test:standalone-installs
      - run: npm run check:standalone-installs
      #
      # Deliberately NOT here: `npm run test:rules` (the Firestore/RTDB rules
      # emulator matrix, tools/scripts/test-rules.sh). It shells out to
      # `firebase emulators:exec --only firestore,database`, so it needs the
      # emulator suite and a JVM rather than the pure node the steps above
      # use. That is a real exclusion with a real reason, recorded here so
      # the next audit does not have to re-derive it (AGL-1778) — the rules
      # themselves are not left unguarded, because rules-drift.yml compares
      # the LIVE ruleset against the promoted one on every rules push and
      # daily.

      # apps/*/tsconfig.next.json are GENERATED from tsconfig.base.json, and
      # the typecheck above skips them by name — correctly, since they exist
      # for next.config's `typescript.tsconfigPath` rather than the native
      # compiler. That leaves nothing able to notice when they go stale, and
      # they did (AGL-1069): a `paths` entry was added to the base config,
      # the generator was never re-run, and three apps quietly resolved
      # nothing for that alias. Explicit and never affected-scoped for the
      # same reason as the step above — the input that invalidates these is
      # tsconfig.base.json, which is no app's source.
      - run: npm run sync:next-tsconfigs:check

      # Same shape: apps/console/constants/docs-help.generated.ts and the
      # besigner subset are generated from apps/docs frontmatter, and go
      # stale when a docs page gains a heading or changes its description.
      # The script has advertised itself as a CI gate since AGL-602 and was
      # never actually wired to one — written, documented, zero callers
      # (`feedback_verify_control_is_wired`). Affected-scoping is wrong here
      # too: the input is apps/docs, the outputs are in console and a
      # besigner lib.
      - run: npm run generate:docs-help:check

      # Third of the same shape (AGL-1728), and the one that was completely
      # unguarded: the four apps/*/plugins.*.generated.ts manifests come from
      # plugins.config.json, and until now the generator had no --check, no
      # npm script, and exactly one caller in the repo — the create-plugin
      # scaffolder, which runs it once at creation time. Hand-edit the config
      # afterwards and nothing re-runs it and nothing notices. Unlike the
      # tsconfigs above these ARE compiled by the typecheck, which is what
      # makes them worse: a stale manifest type-checks perfectly, because a
      # plugin missing from it is not a type error — it is a plugin the
      # runtime loader silently never activates. Not affected-scoped, same
      # reason as the two above: the input is a root-level plugins.config.json
      # that is no app's source, and the outputs land in two apps at once.
      - run: npm run generate:plugin-manifests:check

      # Revenue-truth guard (AGL-1070): org.plan is NOT revenue — a staff
      # override sets `plan` and writes no `subscription`, and three of four
      # production orgs are in that state, so summing PLAN_PRICING[org.plan]
      # overstates MRR 4x. The spec scans apps/** and libs/**, which makes its
      # invalidating input ANY project rather than the console it happens to
      # live in. Affected-scoping it is wrong for the same reason as the three
      # steps above: a new MRR surface landing in apps/tenant would not mark
      # console affected, and the guard would sit out the one commit it exists
      # to catch.
      - run: npx jest --config apps/console/jest.config.ts --rootDir apps/console --testPathPatterns revenue-truth

      # App Router graph boundary (AGL-1350). Same shape again: the walk
      # covers every app's routes and every lib they reach, so its invalidating
      # input is the whole workspace rather than the console it is filed under
      # — a tenant route or a plugin lib crossing the line would not mark
      # console affected. It is also the ONE class here that a green typecheck
      # and a green test suite both miss by construction: AGL-1349 took main
      # down with 141/141 clean, because only `nx build` sees a module graph.
      # Cheap enough (~1s) to run unconditionally, and it fails long before
      # the build step below would.
      - run: npm run check:app-router-graph

      # The shared-ui-jsx barrel allowlist (AGL-1895). Same class as the graph
      # check above: a cost that only a bundler can see, and that a green
      # typecheck and a green test suite both miss by construction. Unlike
      # AGL-1349's build failure, this one never fails anything — it just makes
      # every published customer page heavier, forever, until someone measures.
      # ~1s.
      - run: npm run check:jsx-barrel

      # The @aglyn/aglyn barrel allowlist (AGL-2486). Same class, second
      # entry point: `catch-all-client.tsx` imports it statically, so a heavy
      # package reaching it lands on every published customer page. ~1s.
      - run: npm run check:aglyn-barrel

      # First-load WEIGHT of a published page (AGL-2486 follow-on). The two
      # allowlists above pin WHICH third-party packages the page can reach;
      # neither can see first-party code growing without adding a dependency,
      # which is the same bill at the end of the month. Bandwidth is the
      # largest component of cost of goods sold at every plan tier. ~1s.
      - run: npm run test:tenant-page-weight
      - run: npm run check:tenant-page-weight

      # The affected run, REDIRECTED to a file (AGL-1617). It used to be
      # `| tee`, and the tee was the reason the artifact was useless: a pipe
      # makes nx's stdout ASYNCHRONOUS, and nx ends a failed run with
      # process.exit(), which discards whatever is still in the pipe buffer.
      # Measured both ways on this machine:
      #
      #   node -e 'process.stdout.write("x".repeat(5e6)); process.exit(1)'
      #     | wc -c   ->      65,550   (one pipe buffer, the rest dropped)
      #     > file    ->   5,000,009   (a regular file is synchronous)
      #
      # nx prints FAILED tasks last, so the dropped tail was always the
      # failing task's output. That is why `console:test` went five runs
      # across both workflows with zero ` FAIL ` markers and zero
      # `Tests: … failed` summaries reaching the log OR the artifact, and why
      # the digest — which reads this same file — reported a clean-looking
      # "1 failed suite" while nx named three failed projects. The bytes were
      # never written, so no reader downstream could have recovered them.
      #
      # The cost of the redirect is that the step no longer streams live into
      # the job log; it is `cat` at the end instead. The artifact is the
      # diagnostic path and it is now complete, which it never was.
      # Split out of the single `nx affected -t lint test build` this used to
      # be (AGL-1617). Both halves of the split serve the SAME hypothesis, and
      # it is a hypothesis, not a proven cause — read this before changing it.
      #
      # The evidence: production merge 12c1d7ddf and main HEAD bea7cd7ea are
      # the same tree byte for byte (`git rev-parse <sha>^{tree}` matches, and
      # 12c1d7ddf^2 IS bea7cd7ea). On that identical tree, Main Gate run
      # 32688434102 ran `nx run-many -t test --all --parallel=3 --maxWorkers=2`
      # and went GREEN through all nine phases including the production builds,
      # while NX CI run 32687205268 ran `nx affected -t lint test build
      # --parallel=3` and went RED twice — the original and a `--failed`
      # rerun. `nx run console:test --maxWorkers=2` is green locally too: 586
      # suites, 6821 tests. Same bytes, three greens under one invocation and
      # two reds under the other, so `console:test` is not a broken test —
      # the INVOCATION is the variable.
      #
      # The two invocations differed in exactly two ways, and this step removes
      # both:
      #
      # 1. No `--maxWorkers`, so jest defaults to roughly `cpus - 1` workers
      #    PER PROJECT. Measured locally: `nx run plugins-commerce:test` peaks
      #    at 9 jest-worker children on a 10-core box with no flag, and at
      #    exactly 2 with `--maxWorkers=2`. On a 4-vCPU / 16 GB runner that
      #    difference is most of the memory budget.
      # 2. `build` was co-scheduled with `test` at `--parallel=3`, so two Next
      #    production builds could run alongside the jest fleet. Main Gate runs
      #    its builds as separate later steps, and passes.
      #
      # An OOM-killed jest worker produces PRECISELY the signature we got: the
      # nx task fails, and the log holds zero ` FAIL ` markers, zero
      # `Tests: … failed` summaries and no heap message. No SIGKILL line was
      # found either — but the middle of that group was truncated away, so its
      # absence is not evidence against the theory. Hence: leading hypothesis,
      # and the digest step below is what will settle it next time.
      #
      # ── SETTLED 2026-08-24. Both hypotheses above are WRONG. ──────────────
      # The digest did its job. The first red run carrying real bytes (Main
      # Gate `full`, job 97477291374, 30,855,416 bytes against the 65,550 the
      # pipe used to deliver) named five ordinary failing specs. `console:test`
      # was never a resource failure and never an invocation artifact — it was
      # four deterministic guard reds plus one that only a UTC runner can see:
      #
      #   · icon-button-accessible-name — the guard's own parser. It read an
      #     opening tag to the first `>`, and `onClick={() => …}` has one, so
      #     every prop after an arrow function was invisible. It reported a
      #     button whose `aria-label` sat two lines lower. A FALSE red.
      #   · the AGL-975 marketplace-naming guard — a real new doc link to the
      #     forum page, needing an allowlist entry. (Named obliquely on
      #     purpose: that guard scans every tracked file, this one included,
      #     so spelling its filename here would itself be a stray hit.)
      #   · subprocessor-inventory — `groups.google.com`, newly named in a
      #     diagnostic string, needing a declaration.
      #   · selfhost-hardcoded-hosts (aglyn:test) — fixed separately by
      #     a9f51bc86.
      #   · analytics-day-cache — green on a Chicago laptop and red on a UTC
      #     runner, because a spec cannot change its own timezone under jest.
      #     Pinned at process launch in `apps/console/jest.config.ts`.
      #
      # Why it read as unreproducible: three of the five are repo-SCANNING
      # guards, so they went red the moment the offending content landed, on
      # whatever tree was current — while the "green locally" runs were on an
      # older tree. Nothing was ever flaky. With all five fixed, the whole
      # console suite is green under ambient UTC at `--maxWorkers=2`: 619
      # suites, 7,385 tests, exit 0 — which also retires the OOM theory, since
      # that is the same invocation that was supposed to be starving.
      #
      # Keep the split and `--maxWorkers=2` anyway: they are good hygiene and
      # cost nothing. Just do not read them as the fix for this.
      #
      # Do NOT quietly drop `--maxWorkers=2` to make CI faster. It is the one
      # difference between the invocation measured green on this tree and the
      # one measured red on it. The flag DOES reach jest rather than being
      # swallowed by nx: `maxWorkers` is a first-class option of the
      # `@nx/jest:jest` executor (its schema.json declares it; jest.impl.js
      # forwards it into jest's config), nx echoes it per task as
      # `> nx run <project>:test --maxWorkers=2`, and it survives a
      # MULTI-target invocation — `nx run-many -t lint test --maxWorkers=2`
      # still peaked at exactly 2 workers. Neither build executor sets
      # `additionalProperties: false`, so the extra option is ignored rather
      # than fatal for them.
      #
      # nrwl/nx-set-shas above is untouched by this split. It exports NX_BASE
      # and NX_HEAD through $GITHUB_ENV; nx re-reads them from process.env on
      # every invocation (nx/src/utils/command-line-utils.js), and all three
      # steps here still run after it in the same job — so all three resolve
      # the identical affected set. Verified locally: two separate
      # `nx show projects --affected` invocations under one exported
      # NX_BASE/NX_HEAD return byte-identical project lists.
      - run: npx nx affected -t lint --parallel=3

      - name: test
        run: |
          status=0
          npx nx affected -t test --parallel=3 --maxWorkers=2 \
            > "$RUNNER_TEMP/nx-test.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/nx-test.log"
          exit "$status"

      # --task-failed: this step only runs because the job is already red, so
      # the premise comes from the workflow rather than from a log that may
      # not contain it. A log with nothing in it is INCONCLUSIVE, not clean.
      - if: failure()
        run: node tools/scripts/lib/ci-test-digest.mjs "$RUNNER_TEMP/nx-test.log" --task-failed

      # The raw bytes. Named per job — a different name from main-gate.yml's,
      # so neither can ever collide with the other.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nx-test-log-nx-ci-main
          path: ${{ runner.temp }}/nx-test.log
          retention-days: 7
          if-no-files-found: warn

      # Builds LAST and on their own, so nothing competes with the jest fleet
      # for the runner's 16 GB. A red test step skips this, which is the same
      # coverage the single combined invocation gave: nx failed the whole
      # thing at the first failing task anyway.
      - run: npx nx affected -t build --parallel=3
