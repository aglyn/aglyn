# Can a stranger sign up right now? (AGL-2715)
#
# Every other signup check on this platform is an inference. The auth doors
# assert Identity Platform is reachable, `probeCreate` reads that the platform
# is unlocked and a name is free, and the volume/refusal/drought checks count
# what happened afterwards. On the day AGL-2714 paged, the strongest thing any
# of them could say was "somebody got an account recently", and recently was 24
# hours ago. AGL-2581 is what that costs: signup refused every visitor for
# three days while the monitor named for signups stayed green.
#
# This job walks it. It creates a real account and a real org on PRODUCTION,
# then deletes them and stamps the verdict into one marker that
# `/api/health/journeys` reports as `signupCanary` — graded by the existing
# First-run journeys monitor, so no new row on the uptime board.
#
# ## ⛔ EDITING THIS CRON IS WHAT KEEPS IT FROM RUNNING (AGL-2723)
#
# GitHub does not begin serving a newly added or newly changed `schedule`
# right away, and every edit appears to restart that wait. Measured 2026-09-10
# across this repo: every workflow whose file was last touched before that day
# fired on schedule — `funnel-conversion-alarm` (Sep 5), `scheduled-crons`
# (Sep 7), `uptime-probe` and `tenant-prod-smoke` (Sep 9). Both workflows
# edited THAT day — this one and `edge-admission.yml` — had never fired once,
# five hours in, including at cadences six times higher than the ones being
# served.
#
# So the cadence below is not a lever and raising it was a wrong turn: what
# starves this schedule is churn on the file, not the number in it. Leave the
# expression alone.
#
# ## Delivery is also unreliable once it IS registered
#
# Separately and independently: `uptime-probe.yml` asks every fifteen minutes
# and fired at gaps of 1h55m to 4h38m, and the whole repo went 02:31Z to
# 04:33Z with no scheduled run of anything while GitHub reported all systems
# operational. `SIGNUP_CANARY_STALE_AFTER_MS` is six hours for that reason,
# sized to the measured gaps rather than to this expression.
#
# ## The work rate is bounded regardless
#
# Every walk creates and deletes a real account and org on production and
# sends real mail, so `MIN_WALK_INTERVAL_MS` in the script skips any delivered
# run whose last SUCCESSFUL walk is under forty-five minutes old, without
# touching the marker. That holds whether this cron delivers once an hour or
# six times, and it is what makes the trigger safe to move to Cloud Scheduler
# (`tools/scripts/setup-canary-scheduler.mjs`) without changing anything here.
#
# ## Why a browser, and why no bypass header
#
# Identity Platform enforces App Check and this project's provider is reCAPTCHA
# Enterprise, which has no server-side equivalent — `accounts:signUp` from any
# script is refused 401. So the walk has to happen on a page.
#
# That turns out to be the better design anyway: a browser exercises the edge
# for real. The walk carries no bypass header of any kind, so if bot protection
# starts refusing visitors the canary is refused with them. An ordinary desktop
# Chrome User-Agent measured `429 x-vercel-mitigated: challenge` on 2026-09-09,
# so this is not hypothetical.
#
# ## Failure is reported by the marker, not by this job's exit code
#
# The script always writes its verdict and then exits non-zero on a bad walk.
# The red that matters is the health door going red, because that is what
# pages; a red run here is the same signal arriving by a second road.

name: Signup canary

# ⛔ THIS SCHEDULE DEPENDS ON THE EXCLUSION STAYING LIVE (AGL-2715).
#
# The canary creates a real org on production and deletes it, so without
# `isSignupCanaryOrgSlug` in `/api/orgs/create` its durable attempt marker
# outlives the org and `signupDrought` reads +1 denominator, +0 numerator on
# every walk. It fired exactly that way on 2026-09-09 at `signupAttempts=6,
# orgCreations=0`. Remove or bypass that exclusion and this job manufactures an
# outage on a healthy platform.
on:
  schedule:
    # Hourly, off the top of the hour where every other scheduled job in this
    # repo clusters. The script's own floor decides whether a delivered run
    # actually walks, so this number is a backstop rather than a rate — the
    # real trigger is Cloud Scheduler. Do not tune it: see the note above.
    - cron: '25 * * * *'
  workflow_dispatch: {}

# One walk at a time. Two concurrent runs would race for the same orphan sweep
# and each would try to reap the other's org mid-flight.
concurrency:
  group: signup-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Is App Check admitting real people? Reads only, and independent of the walk
  # on purpose: this is the cover for the walk's debug-token blindness, so it
  # must not go dark just because the walk did.
  attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Sample the verification counts
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'aglyn-main' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node tools/e2e/appcheck-attestation.mjs

  # Hourly. It rides the same AGLYN_PROBE_TOKEN bypass every probe in this
  # repo rides — bot protection refuses a datacenter IP outright, so without it
  # the walk cannot be scheduled at all. If the checkpoint appears anyway the
  # walk reports `challenged`, which is a statement about the edge rather than
  # about signup.
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # firebase-admin and playwright-core only. The full workspace install is
      # not needed and would cost minutes per hour.
      - name: Install the two runtime dependencies
        run: npm install --no-save --no-audit --no-fund firebase-admin@13 playwright-core@1

      # ubuntu-latest ships Chrome. The front-door half needs a real browser:
      # a fetch tool cannot solve the edge challenge, which is the whole point.
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"

      - name: Walk the signup
        env:
          SIGNUP_CANARY_ENABLE: '1'
          SIGNUP_CANARY_ORIGIN: ${{ vars.SIGNUP_CANARY_ORIGIN }}
          # ⚠️ An App Check bypass, allowed for this one CI script by
          # `app-check-debug-token.spec.ts` and covered by the attestation job
          # above — which measures whether App Check is admitting REAL people,
          # something a token cannot fake. Without this the walk cannot attest
          # at all: reCAPTCHA Enterprise scores headless automation as a bot.
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
          AGLYN_PROBE_TOKEN: ${{ secrets.AGLYN_PROBE_TOKEN }}
          # The repo convention: an optional var with the project as the default.
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'aglyn-main' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          # Where the welcome mail lands. Org creation welcomes the owner of a
          # first workspace, so this must be a REAL deliverable address — an
          # address that hard-bounces would cost the sending domain a bounce
          # every hour. Defaults to a plus-address on the owner's mailbox.
          SIGNUP_CANARY_EMAIL: ${{ vars.SIGNUP_CANARY_EMAIL }}
        run: node tools/e2e/signup-canary.mjs
