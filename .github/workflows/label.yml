# Applies path-based labels to a pull request from .github/labeler.yml.
#
# `on:` lists pull_request ONLY. It used to also list `issues`, which never
# did anything: actions/labeler reads the changed-file list off the pull
# request in the event payload, and an issues event carries no pull request.
# Under v2 that was a silent no-op; from v5 on the action fails the job
# outright, so the dead trigger is removed rather than left to break.
#
# The config format this action expects changed in v5 — see the header of
# .github/labeler.yml.

name: Labeler
on:
  - pull_request

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
