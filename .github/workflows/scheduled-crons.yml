name: Scheduled console crons

# Drives the console's scheduled routes (AGL-490). The console and tenant
# Vercel projects both deploy from the repo root, so a shared /vercel.json
# crons block would fire on both (the console-only paths 404 on the other).
# Instead we POST the console's production URL directly, scoped to just the
# console, using the routes' x-cron-secret auth path.
#
# Requires:
#   - secret  CRON_SECRET        — same value as the console Vercel env var
#   - secret  AGLYN_PROBE_TOKEN  — Vercel Bot Protection bypass; see the POST
#                                  step. Without it the console challenges
#                                  this workflow with a 429 checkpoint page.
#   - var     CONSOLE_BASE_URL   — optional; defaults to https://app.aglyn.com
#
# Set CONSOLE_BASE_URL only if your console is not on the default host (a
# fork, or a staging deployment). It must be the host that SERVES the console,
# not one that redirects to it: curl carries neither the POST body nor the
# x-cron-secret header across a redirect, so a redirecting host fails every
# run. That is exactly what happened in AGL-786 — the variable still pointed
# at app.aglyn.io after the AGL-720 domain move, and .io now 307s to .com.
# The step below names that case explicitly when it sees a 3xx.
#
# Every `schedule` entry triggers this one workflow; `github.event.schedule`
# carries the cron string that fired, which the job maps to a route. Note
# GitHub only runs scheduled workflows from the default branch.
#
# DEPLOY ORDERING (AGL-2359). This file runs from `main`; the routes it POSTs
# run from `production`. Those are different trees, and this file's changes
# take effect the moment they land while the route they call only exists after
# a promotion. AGL-1996/AGL-2010 landed `finish-domain-attachments` and its
# schedule together — correct for the repo — and the cron then 404ed ~72 times
# a day against a production deploy 236 commits behind. So the job asks, from
# the repo rather than from the wire, whether the route's source file exists at
# refs/heads/production, and SKIPS the POST when it provably does not.
#
# ⚠️ That skip is deliberately NOT "a 404 is fine". This workflow exists to
# notice broken crons; see the 207 handling at the bottom of the file. The
# skip never reads the cron's response, and tools/scripts/cron-deploy-state.sh
# answers `unknown` — which POSTs anyway, and goes red on a 404 exactly as
# before — for every case it cannot settle, including a missing production
# branch and a route->file mapping that has rotted.

on:
  schedule:
    # ⚠️ The five DAILY schedules are gone from here and live on Cloud
    # Scheduler (`consoleDailyCron` in cloud/functions/src/index.ts).
    #
    # GitHub dropped a whole day of them on 2026-08-27: the 02:00 and 03:00
    # entries did not fire until 12:25 and 13:56, and 04:00, 07:00 and 08:00
    # did not fire at all. Every run that DID fire succeeded — only the
    # dispatch failed, which is the part GitHub documents as best-effort.
    #
    # ⛔ Do not re-add them. These routes must be scheduled in EXACTLY ONE
    # place: `report-usage` meters a closed month into Stripe, so a day on
    # which both runners fired is a day customers were billed twice.
    # `scheduled-crons-wiring.spec.ts` fails the build if a schedule here and
    # a `cloud-scheduler` row in `SCHEDULED_JOBS` ever name the same job.
    #
    # They remain in the `workflow_dispatch` list below — a manual re-run is
    # exactly what the dropped day needed, and dispatch is not a schedule.
    # A POST with no body ARCHIVES AND DELETES; a GET only reports the plan
    # (AGL-2084). This route moves `adminAudit` rows past the 90-day window
    # into Storage and then deletes them from Firestore, and until AGL-2084 a
    # bare GET did all of that too — the same hazard `reap-plugin-artifacts`
    # below had already been given a guard against. `isCronDryRun` keys the
    # default on the METHOD precisely so the bodyless POST this job sends is
    # still a real run.
    # The IN-PROGRESS month (AGL-2219), an hour ahead of usage-alerts so the
    # budget evaluation reads a figure computed today rather than yesterday.
    #
    # This is a SECOND report-usage sweep, and it is not a duplicate of the
    # 02:00 one. That one rolls up the CLOSED month — the invoice — and is the
    # only run that ever reaches Stripe. This one writes
    # `orgs/{id}/usage/{thisMonth}` so that "what has this org spent so far
    # this month" has an answer at all: `report-usage` is the sole writer of
    # that document and only ever wrote the closed month, which left every
    # usage budget on the platform structurally unable to fire and the Billing
    # card permanently saying "we haven't totalled this month yet".
    #
    # `?month=current` in the URL and NOT in the body: the resumable-sweep
    # loop below re-POSTs `{"cursor": ...}` and nothing else, so a month
    # carried in the body would apply to the first chunk and silently revert
    # to the previous month for every chunk after it.
    #
    # The route refuses to meter or stamp `reportedAt` for a month that has
    # not ended, so this schedule cannot bill anybody early however it is
    # invoked — see `monthIsClosed`.
    # HOURLY across the first two days, not one monthly firing (AGL-2409).
    #
    # This route used to read `orgs` with `.limit(1000)` and loop with `await
    # sendEmail` inside: one invocation, up to a thousand messages, as fast as
    # Resend accepts them, on the same key and the same From address that
    # carries every customer's password resets — under `p=reject`, where a
    # throttle is a rejection and not a spam folder.
    #
    # The route is now chunked and resumable, and every send asks the platform
    # send-rate governor (staff-configurable at /admin/emails). A run that hits
    # the hourly ceiling stops and reports `done: true` WITHOUT stamping the
    # orgs it did not reach, so the next hourly firing mails exactly those.
    # `emailedAt` is the idempotence key, so a run over already-mailed orgs
    # costs reads and sends nothing.
    #
    # Two days rather than one, so a low ceiling during a domain warm-up still
    # has 48 windows to drain a thousand orgs through before the month's
    # summaries would be lost.
    - cron: '0 * 1-2 * *' # usage-email    — hourly, 1st-2nd of the month
    # Weekly Firestore GCS export (AGL-1843) — the independent copy that
    # exists because the managed backups kept flipping READY → NOT_AVAILABLE
    # at ~day 7. Mondays 05:00 UTC: the day after the Sunday managed backup,
    # so the two restore points are staggered rather than snapshots of the
    # same instant. The route only STARTS the export (a long-running Google
    # operation); /api/health/backups watches completion via the bucket's
    # markers, so a run that starts and never finishes still alerts.
    - cron: '0 5 * * 1' # firestore-export — Mondays 05:00 UTC
    # Weekly, not daily: orphans only appear when a publisher republishes,
    # and each run lists the whole artifacts bucket. A POST with no body
    # DELETES (the route only defaults to a dry run for GET) — see
    # docs/PLUGIN_LOADING.md for what it will and will not remove.
    - cron: '30 5 * * 1' # reap-plugin-artifacts — Mondays 05:30 UTC
    # Weekly re-verification of stored plugin verdicts (AGL-1086). Versions
    # whose verdict is already current are skipped without downloading
    # anything, so a quiet week costs one read; the run after a
    # PLUGIN_VERIFIER_VERSION bump re-checks everything. It reports and
    # notifies staff about regressions on live versions — it never revokes.
    - cron: '0 6 * * 1' # reverify-plugin-versions — Mondays 06:00 UTC
    # Scope-drift detection (AGL-1478). The backfill this calls has been
    # correct and idempotent since AGL-1040 and NOTHING EVER CALLED IT — no
    # page, no cron, no runbook — so when AGL-1466 left 19 media folders
    # unscoped, the job whose whole purpose is listing exactly those
    # documents sat there while a person worked it out from a file count
    # that looked wrong.
    #
    # A cron-authenticated call is a DRY RUN and cannot be anything else:
    # the route refuses `dryRun: false` to this caller. It REPORTS. A job
    # that silently stamped every unscoped document each week would hide
    # this same class of bug in a new way — the creation paths would stay
    # broken and the sweep would paper over them forever. The repair is a
    # human act; docs/SCOPE_DRIFT.md is how.
    #
    # A non-zero plan returns 207, which fails this workflow below. That is
    # the alert (a staff notification is the other half).
    - cron: '30 6 * * 1' # backfill-scope (detect only) — Mondays 06:30 UTC
    # Does every live SSO domain STILL prove it belongs to the org routing
    # it? (AGL-1210) Domain ownership was proven once, at setup, and then
    # trusted forever — so a company that lets its domain lapse keeps the
    # routing until a human revokes it.
    #
    # Weekly, and REPORT-ONLY. The route has no code path that revokes,
    # deliberately: a DNS lookup cannot tell "the record is gone" from "the
    # resolver did not answer", so an automated revoke on a failed lookup
    # would log out every enterprise on the platform during one resolver
    # blip. It needs three consecutive CONCLUSIVE failures over fourteen days
    # before it will even email anybody, and a human decides what to do.
    - cron: '30 7 * * 1' # reverify-sso-domains (report only) — Mondays 07:30 UTC
    #
    # ⛔ NOTHING SUB-HOURLY BELONGS IN THIS FILE (AGL-1617).
    #
    # `campaigns/process-scheduled` (every 15 minutes) and
    # `finish-domain-attachments` (every 20) used to be here and are now
    # driven by `consoleFastCrons` in `cloud/functions/src/index.ts`, on
    # Cloud Scheduler, alongside `lists/materialize`. All three are still
    # POSTable by hand from the `workflow_dispatch` list below — that is what
    # it is for, and it is the only way to force one of them between ticks or
    # to ask, via the deploy-state step, whether the route is in the deployed
    # tree at all.
    #
    # WHY. GitHub coalesces and silently DROPS scheduled triggers under load,
    # per workflow, and this one carried fourteen `- cron:` entries with each
    # run serving exactly one. Measured 2026-08-22..24 from `gh run list`:
    # this workflow should have fired at least SEVEN times an hour from those
    # two entries alone, and fired TWO TO FOUR — under 40% delivery. Because
    # the surviving runs were split across both schedules, the campaign
    # processor went 104 minutes without a beat on 2026-08-24 (on a
    # fifteen-minute schedule) and the `scheduled-jobs` uptime monitor
    # correctly 503ed. `/product/marketing` sells that feature.
    #
    # What is left here is daily and weekly work, where an hour of GitHub's
    # drift costs nothing and the six/twenty-four hour graces in
    # `SCHEDULED_JOBS` are honest. Adding a `*/n` entry here would be
    # re-opening AGL-1617; `scheduled-crons-wiring.spec.ts` fails the build
    # if you do.
  workflow_dispatch:
    inputs:
      path:
        description: 'Route to trigger manually (e.g. /api/admin/run-erasures)'
        required: true
        type: choice
        options:
          - /api/billing/report-usage
          # The in-progress month (AGL-2219) — computes and stores the running
          # figure, never meters. Safe to run by hand at any time.
          - /api/billing/report-usage?month=current
          - /api/admin/audit-archive
          - /api/admin/run-erasures
          - /api/billing/usage-alerts
          - /api/billing/usage-email
          - /api/admin/reap-plugin-artifacts
          - /api/admin/reverify-plugin-versions
          - /api/admin/backfill-scope
          - /api/admin/reverify-sso-domains
          - /api/admin/firestore-export
          - /api/campaigns/process-scheduled
          - /api/admin/finish-domain-attachments
          - /api/lists/materialize
          - /api/admin/provision-sending-domains
      force:
        # Only /api/admin/reverify-plugin-versions reads this (AGL-1086). A
        # stored verdict is skipped while it is current, which is what makes
        # the weekly run nearly free — so re-checking bytes whose verdict is
        # already current needs saying out loud. After a
        # PLUGIN_VERIFIER_VERSION bump every verdict is stale anyway and this
        # changes nothing.
        description: 'reverify only: re-check versions whose verdict is already current'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve route from the firing schedule
        id: route
        # Pass event fields through env rather than inlining ${{ }} into the
        # shell, so nothing can be interpreted as script (AGL-521).
        env:
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_PATH: ${{ github.event.inputs.path }}
        run: |
          case "$FIRED_SCHEDULE" in
            '0 * 1-2 * *') path=/api/billing/usage-email ;;
            '0 5 * * 1') path=/api/admin/firestore-export ;;
            '30 5 * * 1') path=/api/admin/reap-plugin-artifacts ;;
            '0 6 * * 1') path=/api/admin/reverify-plugin-versions ;;
            '30 6 * * 1') path=/api/admin/backfill-scope ;;
            '30 7 * * 1') path=/api/admin/reverify-sso-domains ;;
            # No arm for the two frequent sweeps: they run on Cloud Scheduler
            # since AGL-1617 and reach this job only via workflow_dispatch,
            # which falls through to $DISPATCH_PATH below.
            *) path="$DISPATCH_PATH" ;;
          esac
          if [ -z "$path" ]; then
            echo "No route resolved (schedule='$FIRED_SCHEDULE')" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # Only for tools/scripts/cron-deploy-state.sh — the POST below needs no
      # checkout and does not get one.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/scripts/cron-deploy-state.sh
          sparse-checkout-cone-mode: false

      - name: Is this route in the deployed tree yet?
        id: deployed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTE: ${{ steps.route.outputs.path }}
        run: |
          state=$(tools/scripts/cron-deploy-state.sh "$ROUTE")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          impl=$(tools/scripts/cron-deploy-state.sh --impl "$ROUTE" || echo '(unmapped)')
          if [ "$state" = 'not-deployed' ]; then
            # Visible in the run's annotations AND in the job summary, because
            # a skip nobody sees is the same silence this workflow is against.
            echo "::notice title=Cron skipped — not deployed yet::${ROUTE} is on this branch but not on 'production' (${impl}). It will start running at the next promotion."
            {
              echo "### Skipped: \`${ROUTE}\`"
              echo
              echo "\`${impl}\` exists here but **not at \`refs/heads/production\`**, so the"
              echo 'route is not in the deployed console yet and a POST could only 404.'
              echo 'This cron starts running at the next promotion — nothing to fix here.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: POST the console cron route
        # `unknown` POSTs. The only outcome that skips is a proven absence
        # from the deployed tree; a 404 from a route that IS in production
        # still fails the job below, untouched.
        if: steps.deployed.outputs.state != 'not-deployed'
        env:
          BASE_URL: ${{ vars.CONSOLE_BASE_URL || 'https://app.aglyn.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Bot Protection was turned on for aglyn-console on 2026-08-21
          # (AGL-2483) and answers an unrecognised automated client with a
          # 429 "Vercel Security Checkpoint" HTML page — NOT a 403, and not
          # anything the response handling below would read as auth. The
          # console's "Machine traffic bypass" rule names the cron paths
          # explicitly, and `/api/campaigns/process-scheduled` (AGL-2134)
          # landed AFTER that list was written, so every */15 run of that one
          # route was challenged for 51 hours while the other eleven passed —
          # which is why this workflow's history reads as intermittent rather
          # than broken.
          #
          # This is the same header every other CI caller of our own hosts
          # sends (`uptime-probe.yml`, the legal drift scripts) and it matches
          # the console's header-scoped "CI and uptime probe bypass" rule, so
          # it fixes every cron route at once rather than one path at a time.
          # It bypasses the bot CHALLENGE and nothing else: `x-cron-secret` is
          # still compared timing-safely by the route, and a wrong secret is
          # still a 401.
          #
          # Absent (a fork, a local run), the header is simply not sent —
          # see tools/scripts/lib/probe-headers.mjs for why that direction.
          AGLYN_PROBE_TOKEN: ${{ secrets.AGLYN_PROBE_TOKEN }}
          ROUTE: ${{ steps.route.outputs.path }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set on this repo" >&2
            exit 1
          fi
          # An ARRAY, not a string: a `-H "x-aglyn-probe: "` with an empty
          # value is not the same request as no header at all, and curl reads
          # a bare `-H "name:"` as "suppress this header" — neither is what an
          # unconfigured checkout should send.
          probe=()
          if [ -n "$AGLYN_PROBE_TOKEN" ]; then
            probe=(-H "x-aglyn-probe: ${AGLYN_PROBE_TOKEN}")
          else
            echo "note: AGLYN_PROBE_TOKEN is not set; this POST will be challenged" >&2
            echo "      by Vercel Bot Protection on any host that has it enabled." >&2
          fi
          url="${BASE_URL}${ROUTE}"
          echo "POST $url${FORCE:+ (force=$FORCE)}"
          # A body only when something asked for one: the scheduled runs send
          # none, and every route here treats a bodyless POST as its normal
          # invocation.
          if [ "$FORCE" = "true" ]; then
            code=$(curl -sS --max-time 300 -o /tmp/cron-body -w '%{http_code}' \
              -X POST "$url" -H "x-cron-secret: ${CRON_SECRET}" "${probe[@]}" \
              -H 'content-type: application/json' -d '{"force":true}')
          else
            code=$(curl -sS --max-time 300 -o /tmp/cron-body -w '%{http_code}' \
              -X POST "$url" -H "x-cron-secret: ${CRON_SECRET}" "${probe[@]}")
          fi
          echo "HTTP $code"
          echo "--- response ---"
          cat /tmp/cron-body || true
          echo
          # Resumable sweeps (AGL-1141). A route too big for one function
          # invocation returns `done:false` with a `nextCursor`; keep calling
          # until it finishes. Routes that do not chunk never emit the field
          # and fall straight through, so this is opt-in per route.
          #
          # 207 means "finished this chunk, some subjects failed" — the loop
          # continues (the cursor has already moved past them) and the failure
          # is re-checked at the end, so one bad org cannot both stall the
          # sweep and go unnoticed.
          partial=0
          if [ "$code" = "207" ]; then partial=1; fi
          pages=1
          while [ "$code" = "200" ] || [ "$code" = "207" ]; do
            # Pure-shell matching, not sed alternation: `\(true\|false\)` is a
            # GNU extension that BSD sed does not support, so it would work on
            # the Ubuntu runner and silently never loop anywhere else. A cron
            # that quietly stops after one chunk is the bug this loop exists
            # to fix, so it must not depend on which sed is installed.
            body=$(tr -d ' \n' < /tmp/cron-body)
            case "$body" in *'"done":false'*) ;; *) break ;; esac
            cursor=$(printf '%s' "$body" | sed -n 's/.*"nextCursor":"\([^"]*\)".*/\1/p' | head -1)
            if [ -z "$cursor" ]; then
              echo "done:false but no nextCursor — refusing to loop" >&2
              exit 1
            fi
            pages=$((pages + 1))
            if [ "$pages" -gt 50 ]; then
              echo "Sweep did not finish in 50 chunks — stopping" >&2
              exit 1
            fi
            echo "--- chunk $pages (cursor $cursor) ---"
            code=$(curl -sS --max-time 300 -o /tmp/cron-body -w '%{http_code}' \
              -X POST "$url" -H "x-cron-secret: ${CRON_SECRET}" "${probe[@]}" \
              -H 'content-type: application/json' \
              -d "{\"cursor\":\"${cursor}\"}")
            echo "HTTP $code"
            cat /tmp/cron-body || true
            echo
            if [ "$code" = "207" ]; then partial=1; fi
          done
          if [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
            echo "Cron route returned $code — BASE_URL ($BASE_URL) redirects." >&2
            echo "curl drops the POST body and x-cron-secret across a redirect," >&2
            echo "so set the CONSOLE_BASE_URL repo variable to the host that" >&2
            echo "actually serves the console (see AGL-786)." >&2
            exit 1
          fi
          if [ "$code" != "200" ] && [ "$code" != "207" ]; then
            echo "Cron route returned $code (expected 200)" >&2
            exit 1
          fi
          # A sweep that finished but skipped subjects must go RED. The whole
          # reason the original timeout went unnoticed for a day is that a
          # partial month looked like no month at all — silence is the bug.
          if [ "$partial" = "1" ]; then
            echo "Sweep finished, and something in it needs a person (HTTP 207)." >&2
            echo "report-usage and friends: see the 'failures' map above." >&2
            echo "backfill-scope: see 'drift' — documents with no visibleTo," >&2
            echo "invisible to every site-scoped read. docs/SCOPE_DRIFT.md." >&2
            exit 1
          fi
