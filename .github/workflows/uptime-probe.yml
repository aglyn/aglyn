name: Uptime probe

# Measures before committing to a number (AGL-1102).
#
# The SLA issue asks for a percentage, a status page and an incident process.
# None of those mean anything without uptime history, and there was none: no
# health endpoint, no probe, nothing recorded. This is the plumbing. The
# percentage is AGL-1148, deliberately gated on data this produces.
#
# Runs on GitHub's runners, NOT our infrastructure. That is the only part that
# makes it a real probe — a monitor hosted on the thing it monitors cannot
# observe its own outage.
#
# WHAT THIS IS NOT: a substitute for an external uptime monitor. GitHub's
# scheduled runs are best-effort; they can be delayed or skipped under load,
# and they do not run at all if the repository goes quiet for 60 days. So a
# gap here is NOT evidence of an outage, and an unbroken green history is NOT
# evidence of 100% uptime. Do not quote it as one. It exists so the endpoints
# are continuously exercised from outside the deploy, and so there is
# something concrete to point a paid monitor at when one is chosen.
#
# The run history IS the record. A failed run is where an incident starts.
#
# Optional:
#   var CONSOLE_BASE_URL — defaults to https://app.aglyn.com
#   var TENANT_BASE_URL  — defaults to https://demo.aglyn.app
#
# Both must be hosts that SERVE the app, not ones that redirect to it. The
# probe refuses to follow a 3xx and reports it, because a redirecting host is
# exactly the misconfiguration that broke every scheduled cron run for a week
# after the aglyn.io → aglyn.com move (AGL-786).
#
# ⚠️ "serves the app" is not the same as "answers /api/health", and the
# tenant default was wrong on exactly that distinction until 2026-08-23
# (AGL-1617). It read https://demo.aglyn.com — a workspace-subdomain shape
# with no host doc behind it, whose ROOT 404s — and because health routes are
# host-independent this workflow reported UP every fifteen minutes on a
# hostname that served no page. Neither variable was set, so the literal
# below is what actually ran. `tools/scripts/lib/uptime-targets.test.mjs`
# now fails if the tenant target goes back to that shape.

on:
  schedule:
    # Every 15 minutes. Finer than GitHub reliably delivers, and there is no
    # value in pretending otherwise — see the caveat above.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a clearly-labeled TEST message to Slack #ci'
        type: boolean
        default: false

concurrency:
  # A delayed run must not pile up behind a later one; the newest sample is
  # the only one worth having.
  group: uptime-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No install step on purpose: the probe uses only built-in fetch, so
      # this job cannot be broken by a dependency, a lockfile, or a registry
      # outage. A monitor that fails for reasons unrelated to what it monitors
      # is worse than no monitor — every false alarm makes the next real one
      # easier to ignore.
      - name: Probe health endpoints
        run: |
          node tools/scripts/probe-uptime.mjs \
            "console=${CONSOLE_BASE_URL:-https://app.aglyn.com}" \
            "tenant=${TENANT_BASE_URL:-https://demo.aglyn.app}"
        env:
          CONSOLE_BASE_URL: ${{ vars.CONSOLE_BASE_URL }}
          TENANT_BASE_URL: ${{ vars.TENANT_BASE_URL }}
          # Matches the "CI and uptime probe bypass" Vercel firewall rule on
          # aglyn-tenant and aglyn-docs. Without it Bot Protection challenges
          # the probe and every run reports a false outage.
          AGLYN_PROBE_TOKEN: ${{ secrets.AGLYN_PROBE_TOKEN }}
          # Handed to the reporter below rather than re-probed, so the alert
          # describes THIS run's samples and cannot disagree with them.
          UPTIME_RESULTS_PATH: ${{ runner.temp }}/uptime-results.json

      # THE NOTIFICATION (AGL-2586). This workflow has watched thirteen
      # endpoints every fifteen minutes and told nobody: its own header says
      # "the run history IS the record", and that is precisely how
      # `/api/health/crons` answered 503 for fifty-one hours unread. Main Gate
      # had the same shape and was repaired by sending its red to Slack `#ci`
      # (AGL-2533); this is that repair for the other half of the board, and it
      # matters more now that JOURNEY checks are on the list — a red here can
      # mean nobody can publish or every lead is being dropped.
      #
      # `if: always()` and the script's own exit-0 discipline are both
      # deliberate: a monitor that failed BECAUSE it could not report would be
      # strictly worse than the silence it replaces. A green run posts nothing.
      #
      # NO DEDUPE, unlike Main Gate's reporter, and that is the correct call
      # for a probe that grades a MOMENT rather than a sha — two consecutive
      # failing runs are two samples of an outage that is still happening.
      - name: red -> Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          node tools/scripts/report-uptime-red.mjs \
            --results="${{ runner.temp }}/uptime-results.json" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Proving the notifier without waiting for an outage (AGL-2586). A path
      # whose only test is a real incident is unverifiable until the day it
      # matters, which is the shape this issue is about. The message labels
      # itself as a test in every stream a reader can land on — a test alert
      # that reads as an incident has false-alarmed.
      - name: TEST the notification path
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          node tools/scripts/report-uptime-red.mjs --test \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
