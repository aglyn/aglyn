name: Rules drift

# Fails when the LIVE Firebase security rules differ from the PROMOTED rules
# file (AGL-1509; baseline corrected by AGL-1690).
#
# Rules deploy MANUALLY (tools/scripts/deploy-*-rules.mjs), outside the
# git -> Vercel pipeline, so a merged commit touching cloud/firebase-*.rules
# is NOT evidence the ruleset shipped. AGL-1489: production Firestore rules
# sat a day behind with `mediaTombstones` missing from the deny-lists —
# strictly MORE permissive than what review approved — and only a manual
# launch sweep noticed. This workflow is that sweep, standing.
#
# THE BASELINE IS `origin/production`, NOT the checked-out branch. The deploy
# runs from a checkout pinned to the PROMOTED SHA, never from `main`, so the
# ruleset that is live is the one at the last promotion. Comparing against
# `main` made every rules commit go red for the whole promotion window — the
# designed state reported as a failure — and a check that cries wolf on every
# push is one people learn to ignore, which is how the REAL drift gets missed.
# Between a rules commit landing on `main` and the promotion, the delta is
# printed as a PENDING DEPLOY ledger and the job stays green.
#
# What still fails the job, unchanged:
#  - rules edited in the Firebase console and never committed (live ahead of
#    `origin/production` — lines live that exist in no promoted commit);
#  - a promotion whose manual rules deploy was skipped: once `production`
#    carries the rules commit, the baseline is ahead of live and the job goes
#    red — immediately, via the `production` push trigger below;
#  - a partial or failed deploy that left live mid-way.
#
# Three triggers:
#  - push to `production` touching a rules file: the promotion itself. This is
#    the moment the rules deploy is owed, so this is the run that must be
#    green. Re-run it after deploying to turn it green.
#  - push to `main` touching a rules file (or the checker): proves the commit
#    did not also change live behind the promotion process, and prints what is
#    now owed at the next promotion.
#  - daily schedule: catches a console hot-fix on days nothing merged.
#    (GitHub schedules are best-effort and pause on 60-day-quiet repos; a
#    green history is not proof of continuous convergence.)
#
# Requires repo secrets (from the service-account JSON the deploy scripts
# already use via the root .env):
#   gh secret set FIREBASE_CLIENT_EMAIL --body '<client_email>'
#   gh secret set FIREBASE_PRIVATE_KEY --body "$(jq -r .private_key service-account.json)"
# Optional repo vars: FIREBASE_PROJECT_ID (default aglyn-main),
# FIREBASE_STORAGE_BUCKET (default {project}.appspot.com),
# FIREBASE_DATABASE_URL (default {project}-default-rtdb.firebaseio.com).
# NOTE repo variables survive domain/org migrations (AGL-786) — if the
# project ever moves, update them, don't trust them.
#
# When the secrets are ABSENT the guard step below fails the job loudly with
# setup instructions. Never convert that to a skip: a skipped check that
# renders green is the exact silent-drift failure mode this workflow exists
# to prevent, and the checker itself exits 2 (cannot-check) rather than 0 for
# the same reason. An unresolvable baseline ref is exit 2 as well — the
# checker never falls back to HEAD, because that fallback would quietly
# restore the wrong comparison and look like a genuine failure.

on:
  push:
    branches:
      - main
      - production
    paths:
      - cloud/firebase-firestore.rules
      - cloud/firebase-storage.rules
      - cloud/firebase-database.rules.json
      - tools/scripts/check-rules-drift.mjs
      - tools/scripts/lib/rules-drift.mjs
      - tools/scripts/lib/firebase-rules-api.mjs
      - .github/workflows/rules-drift.yml
  schedule:
    # Daily, 07:23 UTC — off the top of the hour, where GitHub's scheduler
    # congestion is worst.
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  # Only the newest comparison matters; a delayed run must not pile up.
  group: rules-drift
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0: the checker resolves `origin/production` and lists the
      # rules commits in `origin/production..HEAD`. A shallow clone cannot do
      # either, and the checker exits 2 rather than guessing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the promoted baseline
        run: |
          git fetch --no-tags origin \
            +refs/heads/production:refs/remotes/origin/production

      - name: Refuse to no-op without credentials
        env:
          CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_EMAIL" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY repo secrets are not set." >&2
            echo "" >&2
            echo "This job verifies the LIVE security rules match HEAD. Without" >&2
            echo "credentials it cannot see live, and passing anyway would be the" >&2
            echo "silent-drift failure mode it exists to prevent (AGL-1489)." >&2
            echo "Create the secrets once, from the service-account JSON:" >&2
            echo "  gh secret set FIREBASE_CLIENT_EMAIL --body '<client_email>'" >&2
            echo "  gh secret set FIREBASE_PRIVATE_KEY --body \"\$(jq -r .private_key service-account.json)\"" >&2
            exit 2
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # firebase-admin mints the service-account token — the same auth path
      # the deploy scripts use, shared via tools/scripts/lib/firebase-rules-api.mjs.
      - run: npm ci

      # Guard the guard (AGL-1778). Everything below trusts this detector's
      # verdict about production security rules, and until now nothing checked
      # that the detector still detects: `test:rules-drift` existed as a script
      # and was invoked by no workflow at all. Run it BEFORE the comparison —
      # a broken comparator that reports "no drift" is indistinguishable from
      # convergence, which is the exact silent-pass this workflow exists to
      # prevent (AGL-1489). Same reasoning nx-ci.yml applies to
      # `test:eslint-rules`, and never affected-scoped for the same reason:
      # tools/ is not an nx project, so `nx affected` cannot reach it.
      - run: npm run test:rules-drift

      # The index checker's self-test, run here as well as in index-drift.yml
      # for the same AGL-1778 reason and in the same direction: asserted only
      # from inside the workflow it guards, "the workflow runs the self-test"
      # is circular — deleting the step deletes the check on the deletion. The
      # second home has to be a workflow that ACTUALLY RUNS, which nx-ci.yml
      # (disabled_manually) does not.
      - run: npm run test:index-drift

      - name: Diff live rules against the promoted baseline
        env:
          # The promoted SHA is what the deploy script was pinned to, so it is
          # what SHOULD be live. On a `production` push this equals HEAD and
          # the run reads exactly as an unpinned one.
          RULES_DRIFT_BASELINE: origin/production
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'aglyn-main' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: npm run check:rules-drift
