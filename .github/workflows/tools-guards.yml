name: Tools guards

# Runs the pure-node `tools/` guard suites whose only other home is nx-ci.yml.
#
# AGL-2381: the reason recorded here used to be that nx-ci.yml was
# `disabled_manually` and ran on no runner, so every gate added to it since it
# was switched off had never executed once. That is FALSE — the Actions API
# reports nx-ci.yml as `active`, and it runs on every push to main and on every
# pull request.
#
# The duplication is kept anyway, for a reason that does not depend on a
# workflow's enabled/disabled state — a state no diff can show, and which drifts
# silently, which is how this comment came to be wrong in the first place.
# nx-ci.yml is a SINGLE sequential job, and `npm run typecheck` and
# `npx nx run docs:typecheck` sit ahead of every guard step in it. Any type
# error anywhere in the workspace therefore withdraws ALL of these guards at
# once. Measured on 2026-08-19: across 72 completed nx-ci runs the guard steps
# executed in 26 and were skipped in 46 — a 36% answer rate, while `npm ci` and
# `typecheck` ran in 72 of 72.
#
# So nx-ci.yml is a real home but a conditional one, and it is conditional on
# something entirely unrelated to what these guards measure. This workflow is
# the unconditional home: secretless, dependency-light, seconds each, and it
# answers whether or not the tree type-checks
# (AGL-1776/AGL-1816/AGL-1822/AGL-2381).
#
# What each guards:
#  - test:eslint-rules        the eight local ESLint guard rules' RuleTester
#                             suites (the RULES run at every `nx lint`; their
#                             self-tests otherwise run nowhere)
#  - test:plugin-loader       the sandbox CSP the plugin origin serves (AGL-1092)
#  - test:disk-space          the dev-loop preflight that can fail every serve
#                             target at once (AGL-1425)
#  - test:deploy-guard        the clean-deploy-source guard that decides what
#                             ships (AGL-1778)
#  - test:erase-cli           the org-erase CLI that decides what gets
#                             destroyed (AGL-1778)
#  - test:standalone-installs the enumerated-standalone-packages policy
#                             (AGL-1781)
#  - test:release-version     the semver/bump/changelog rules a release
#                             depends on (AGL-2089) — a wrong bump does not
#                             throw, it just mints a wrong number forever
#  - test:manifest-versions   / check:manifest-versions  the package.json vs
#                             package-lock.json version agreement (AGL-2108) —
#                             a drift `npm ci` does not read and the promotion
#                             gate stayed green over for a whole release
#  - test:monaco-dompurify    / check:monaco-dompurify  the four DISMISSED
#                             DOMPurify alerts (AGL-2300). monaco inlines
#                             DOMPurify 3.4.8 into the bundle we serve from our
#                             own origin and there is nowhere to upgrade to;
#                             the dismissals rest on monaco never passing the
#                             config options those advisories need. This is the
#                             only thing re-measuring that.
#  - test:marketing-width-doctrine / check:marketing-width-doctrine  the
#                             marketing authoring docs must state the stock
#                             `maxWidth: "xl"` container invariant and never
#                             prescribe a pixel column (AGL-1298). The
#                             container specs already refuse a 1328 cap in
#                             CODE; the docs went on recommending one — and
#                             justified it with a 1280 column that appears in
#                             no measurement of any frame — which points the
#                             next agent at relaxing the test and narrowing a
#                             site that is already exactly on-design
#  - test:docs-self-host      / check:docs-self-host  apps/docs must not
#                             compile in our GA id, our error collector or our
#                             production origins (AGL-2124) — it ships in the
#                             open-source distribution
#  - check:standalone-installs  asserts every nested package with its own
#                             lockfile has an install step in nx-ci.yml. That
#                             file is currently disabled; the check still
#                             matters because it keeps the TEXT complete for
#                             the AGL-1776 re-enable decision, and because a
#                             THIRD standalone package landing without any
#                             install step is invisible on every dev checkout
#                             (nested node_modules mask it). Run from HERE —
#                             an active workflow — the assertion is about a
#                             file's content, not about this workflow, so it
#                             is not circular.
#
# tools/ is not an nx project, so `nx affected` cannot reach any of these and
# no Nx Cloud involvement exists here (the thing nx-ci.yml was disabled over).
# The paths filter below is the cheap approximation of affected-ness.
#
# NO nested installs: apps/docs and cloud/functions are standalone packages a
# root `npm ci` does not reach (AGL-1781) — but none of these seven suites
# imports from either, so this workflow deliberately does not pay for their
# installs. If a suite ever grows such an import, add the matching
# `npm ci --prefix <dir>` line rather than working around the failure.
#
# Anti-circularity (the AGL-1804/AGL-1816 precedent): "this workflow runs the
# seven suites" is asserted from OUTSIDE this file, in
# tools/scripts/lib/rules-drift.test.mjs — a suite that rules-drift.yml and
# index-drift.yml (both active) each run. Deleting a step here turns both
# drift workflows red. The `npm run test:rules-drift` step below runs that
# same suite HERE as well, so an edit to this file that drops a guard step
# goes red on the very push that makes it (this workflow triggers on itself),
# not a day later on the drift workflows' schedules.
#
# ⚠️ Do NOT move these steps into nx-ci.yml, and do not make any step here
# conditional. A skipped check that renders green is the silent failure mode
# the whole AGL-1776 audit was about. Exit codes propagate naturally — never
# pipe a gate command.

on:
  push:
    branches:
      # Sept-1 freeze (decided): the push trigger moved from `main`
      # to `production`. With many agents landing on `main` continuously this
      # workflow was running dozens of times an hour and every red notified
      # him, so CI became noise rather than signal. It is a RELEASE gate until
      # launch: `main` is verified before promotion by `tools/gate.sh`
      # (AGL-2090), and the promotion PR still runs `pull_request` below.
      # RESTORE `main` AFTER LAUNCH — until then a break can sit on `main`
      # unnoticed until someone runs the gate.
      - production
    paths:
      - 'tools/**'
      # AGL-2025: `check:hardcoded-colours` sweeps apps/ libs/ cloud/, so its
      # trigger has to be the code it measures. Watching only `tools/**` is
      # what made the retired-colour census structurally unable to see the 161
      # literals in `libs/plugins` — a guard that runs only when the guard
      # changes cannot catch a regression in the thing it guards.
      - 'apps/**'
      - 'libs/**'
      - 'cloud/**'
      # The scripts themselves are defined here.
      - package.json
      - package-lock.json
      # test:ttl-policies compares the TTL script against this doc's table, so
      # a doc-only edit must trigger the guard that would catch the mismatch.
      - docs/FIRESTORE_MANUAL_CONFIG.md
      # check:standalone-installs asserts against nx-ci.yml's text — an edit
      # deleting an install step must trigger the check that would catch it.
      - .github/workflows/nx-ci.yml
      - .github/workflows/tools-guards.yml
      # check:node-version reads EVERY tracked workflow and composite action,
      # so a pin reintroduced in any of them has to trigger the guard that
      # would catch it — the lesson the retired-colour census records two
      # comments up, applied to a different tree.
      - '.github/workflows/**'
      - '.github/actions/**'
      # The runtime the guard compares everything against.
      - .nvmrc
      # AGL-2021: check:no-tax-identifiers scans every TRACKED file, so its
      # trigger cannot be narrower than the trees a forbidden identifier could
      # land in. Without these, a commit touching only apps/console — exactly
      # where the identifiers lived — would not run the guard that catches it.
      # This does make the workflow run on most pushes; the eight other guards
      # here are seconds each and the job is secretless, which is the trade
      # that makes it affordable.
      - 'apps/**'
      - 'libs/**'
      - 'cloud/**'
      - 'docs/**'
      - '.claude/**'
  # THE TRIGGER THIS FILE ALREADY CLAIMED TO HAVE (AGL-2505).
  #
  # The push comment above ends "the promotion PR still runs `pull_request`
  # below", and the concurrency group below is written around
  # `github.event_name == 'push'` precisely so that pull_request runs
  # supersede one another. Both were describing a trigger that was not here.
  #
  # The consequence was measured, not guessed: 86 guards are derived from this
  # file and nx-ci.yml, nx-ci.yml carries 21 of them, and the other **65 never
  # saw a pull request**. They ran on push to `production` — after the merge,
  # against the deployed tree — and on the daily schedule. That is an alarm,
  # not a gate: it tells you the promotion was broken once the promotion is
  # live. `check:linear-ids`, `check:manifest-versions`, `check:nul-bytes`,
  # `check:personal-identifiers` and `check:no-tax-identifiers` were all in
  # that set.
  #
  # Affordable for exactly the reason the paths comment above gives: the job
  # is SECRETLESS (`permissions: contents: read`), so it is safe on a fork or
  # dependabot PR where secrets are withheld, and the whole sweep is ~60s
  # locally. No path filter here on purpose — several guards sweep every
  # tracked file, so on a PR the honest scope is the whole tree.
  pull_request:

  schedule:
    # Daily, 07:53 UTC — off the top of the hour, where GitHub's scheduler
    # congestion is worst, and after the two drift workflows (07:23, 07:41)
    # so the three do not contend for the same npm cache warm-up.
    # (GitHub schedules are best-effort and pause on 60-day-quiet repos; a
    # green history is not proof of continuous coverage.)
    - cron: '53 7 * * *'
  workflow_dispatch:

concurrency:
  # A push is grouped by its own COMMIT, so two pushes never contend and no
  # push can evict another: every commit on main gets its own verdict. Only
  # non-push events (pull_request, schedule, workflow_dispatch) share a
  # ref-scoped group and supersede each other, which is where superseding is
  # actually what you want — on a PR the newest tree is the only one anyone
  # will read, and a delayed scheduled run must not pile up.
  #
  # AGL-2378: the group key is the fix, NOT `cancel-in-progress`. A constant
  # group with cancel-in-progress:true discarded 47 of 82 push runs on main
  # here on 2026-08-19 — each killed mid-job by the next push, which is a
  # DIFFERENT tree. Setting cancel-in-progress:false would not have saved
  # them either: a concurrency group holds one running run plus at most ONE
  # pending run, so a third arrival cancels the pending one before it starts
  # a single job. emulator-guards.yml proved that separately — 39 cancelled
  # runs on main, every one of them with zero jobs, under a guard that
  # already declined to cancel in progress.
  group: tools-guards-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 is REQUIRED, not a nicety (AGL-1920). `test:rules-drift`
      # below builds its promotion-window fixture from real history — the last
      # commit touching cloud/firebase-firestore.rules, and that commit's
      # PARENT. A shallow clone has neither, and worse, it lies rather than
      # erroring: the graft commit has no parents, so every file reads as
      # newly added in it and `git log -1 -- <path>` returns HEAD itself.
      # `<HEAD>^` then does not resolve, the self-test fails, and because it
      # is the FIRST guard step every suite below it is skipped — this
      # workflow rendered red while checking nothing, for four days.
      # check:standalone-installs only needs `git ls-files`; this is for the
      # drift self-test. rules-drift.yml has always fetched full history for
      # the same reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # Root install only — see the no-nested-installs note above. The
      # RuleTester suites need eslint/@typescript-eslint from here; everything
      # else is node builtins + files in tools/.
      - run: npm ci

      # The wiring guard, first: this suite asserts (among its own comparator
      # tests) that THIS workflow still runs all seven guard steps below, so a
      # broken wiring fails the job before any partial green is printed. Its
      # other homes are rules-drift.yml and index-drift.yml — see the
      # anti-circularity note above.
      - run: npm run test:rules-drift

      - run: npm run test:eslint-rules

      - run: npm run test:plugin-loader

      - run: npm run test:disk-space

      - run: npm run test:deploy-guard

      # AGL-2014 — holds tools/scripts/set-firestore-ttl.mjs to the TTL table in
      # docs/FIRESTORE_MANUAL_CONFIG.md. The script is the only reproducible way
      # a self-host install gets TTL policies, and it had drifted to one of the
      # documented eight. Triggered by the `docs/FIRESTORE_MANUAL_CONFIG.md`
      # path added above, so editing the doc alone still runs it.
      # test:firebase-credential-message  the message a self-hoster gets when
      #                             Firebase refuses their service account
      #                             (AGL-2447). The three rules-deploy scripts
      #                             are the FIRST commands the runbook has an
      #                             operator run, and a wrong account printed
      #                             230 lines of GaxiosError naming no variable.
      - run: npm run test:firebase-credential-message
      # The typecheck shard map (AGL-2505). `npm run typecheck` is split
      # across runners now, and a shard map that DROPS a config produces a
      # green typecheck that never compiled it — indistinguishable from a real
      # pass. The partition property is asserted here rather than trusted.
      - run: npm run test:typecheck-shard
      - run: npm run test:ttl-policies

      - run: npm run test:erase-cli

      # AGL-1889. The finder that decides whether a persisted synthetic `$id`
      # is still in production, and — the part worth a CI step — the gate that
      # stops it reporting a vacuous zero. A sweep for a key that is MISSING
      # fails by saying "none", which is the same word a clean database
      # produces, so `assertPositiveControl` throws unless the sweep can
      # demonstrate it saw the key nested in besigner node maps where it
      # legitimately lives. Pure logic, no credentials.
      - run: npm run test:synthetic-id

      # AGL-1488. The shared writer every seed and migration script now uses
      # to land a media document, so the document and `counters/media` cannot
      # come apart. That counter gates the storage quota and, since AGL-1473,
      # is a billing input — four script call sites wrote media documents past
      # it independently, and the drift always runs one way: the counter reads
      # LOW, so the customer is under-limited and the metered plans under-bill.
      #
      # The test's Firestore double models read-before-write, which is not
      # decoration: the first version of the helper read the counter AFTER
      # setting the document, which the real Admin SDK rejects outright, and a
      # laxer double reported it green.
      - run: npm run test:media-counter

      # AGL-1734. The demo org has to be several visibly different businesses:
      # the founding demo spends its largest block switching between sites in
      # one org, and a switcher showing one bakery three times argues the
      # opposite of the pitch. The guard runs the seed engine over every brand
      # pack and compares the documents, so it fails both when the packs
      # collapse toward one shape and when the engine stops honouring them.
      # Pure node, no emulator, under a second.
      - run: npm run test:demo-brands

      # test:uptime-targets  WHAT the uptime probe watches (AGL-1617). Two
      # separate blindnesses: the tenant target was a workspace-subdomain
      # shape whose root 404s — health routes are host-independent, so the
      # probe was green every fifteen minutes on a hostname serving no page —
      # and the two render canaries built to replace the dead GCP page checks
      # had no reader at all. The canary half is derived from the filesystem,
      # so a third canary fails this until a monitor points at it. Pure node.
      #
      # Widened to EVERY health endpoint either app ships (AGL-1921), in both
      # directions: an endpoint on disk that nothing probes, and a watched path
      # no app serves. The second one is what lets the probe report a
      # not-yet-promoted route as PENDING instead of failing a run every
      # fifteen minutes over the deploy queue, without that tolerance being a
      # place a deleted route could hide.
      - run: npm run test:uptime-targets

      # test:week-one-preflight  The launch pre-flight's OWN self-test
      # (AGL-1617). The script implements every mechanically-checkable item of
      # runbook precondition P4, including the per-host brand-content
      # assertion that is the only thing standing behind the render canary's
      # deliberately structural verdict — and it ran in NO WORKFLOW AT ALL. It
      # slipped past `check:test-wiring` legitimately: that guard sweeps
      # `*.test.mjs` / `*.spec.mjs`, and this is a `check-*.mjs`, so nothing
      # was ever going to notice.
      #
      # This step runs `--self-test`, NOT the live check, and the distinction
      # is the whole design. The live run reads a Google Drive shared drive
      # and live Stripe; in CI it can only ever exit 2 (could-not-evaluate),
      # which is a check that cannot pass — theatre, not wiring. The
      # self-test runs every check against a deliberately broken fixture in
      # its own mkdtemp and FAILS IF ANY CHECK STAYS GREEN, so what this
      # guards is that the pre-flight can still detect the things it claims
      # to. Secretless and offline-safe: a fetch that cannot reach the network
      # grades red, which is the direction the self-test wants anyway.
      - run: npm run test:week-one-preflight

      # test:runbook-commands  The launch-day runbook's script references
      # (AGL-1533). `LAUNCH_DAY_RUNBOOK.md` is executed once, by one person, at
      # 6am, and it tells that person to run named scripts. Nothing checked
      # that those scripts are where the document says they are — and the
      # 2026-08-24 pass found one that was not: the runbook's companion prose
      # said `tools/scripts/verify-production-aliases.mjs`, and the file is at
      # `tools/deploy/verify-production-aliases.mjs`. That is not a soft
      # failure; it is `Cannot find module` on the step that verifies a
      # production alias before tagging.
      #
      # Same split as week-one-preflight above, for the same reason: this step
      # runs `--self-test`, NOT the live check. The live run reads the
      # "Platform Docs" shared drive, which CI does not mount, so there it can
      # only ever exit 2 (INCONCLUSIVE) — a check that cannot pass is theatre.
      # The self-test carries the proof instead: it drives the evaluator at a
      # missing script, a missing npm target, a glob resolving to nothing, and
      # an on-disk fixture, and FAILS IF ANY OF THEM STAYS GREEN — with a
      # positive control so that a green run cannot be the extractor simply
      # matching nothing. Secretless and offline.
      - run: npm run test:runbook-commands

      # test:ci-test-digest  The CI test digest (AGL-1617). Main Gate run
      # 32685698590 and NX CI run 32687205268 both went red with nothing but
      # "Failed tasks: - console:test": GitHub truncates the MIDDLE of a long
      # ##[group] and jest prints its failure block in the middle, so the full
      # 244,397-line log carried zero FAIL markers and zero failed-test
      # summaries. main-gate.yml and nx-ci.yml now tee their test run and
      # print this digest on failure. What this step guards is the digest
      # itself, and above all its THIRD verdict: a task that failed with no
      # failed test in the log must grade INCONCLUSIVE, never clean. Pure
      # node, no network, ~1s.
      - run: npm run test:ci-test-digest

      - run: npm run test:standalone-installs

      - run: npm run check:standalone-installs

      # AGL-2531. One node major, declared in .nvmrc and nowhere else. The
      # guard has to run HERE rather than only in nx-ci: this workflow is the
      # one whose own `node-version-file` it is asserting, and a pin
      # reintroduced in a scheduled workflow would otherwise be caught by
      # nothing until a promotion inherited it.
      - run: npm run test:node-version

      - run: npm run check:node-version

      # AGL-2090. `tools/gate.sh` provisions the pinned gate worktree, and the
      # checks it makes before running anything are the difference between a
      # verdict and an infrastructure crash wearing a verdict's exit code: a
      # symlinked node_modules (Turbopack refuses it, so the production build
      # cannot run), a nested node_modules/node_modules from a hard-link copy
      # (two Reacts, 1000+ null-useState failures), and the two standalone
      # trees whose absence fails docs:build and cloud-functions:lint. This
      # builds each broken shape on purpose and asserts the refusal — the
      # guard has to be seen failing to be worth anything. Pure bash + mktemp,
      # no install, well under a second.
      - run: npm run test:gate-script

      # AGL-2486. The guards phase is no longer a serial loop inside gate.sh —
      # it is tools/scripts/run-guards.mjs, which DERIVES the guard list from
      # this file and nx-ci.yml and runs it concurrently (1m09s -> ~15s). That
      # makes the derivation load-bearing for every gate run: a query that
      # silently matches nothing would exit green having gated nothing, which
      # is precisely the shape gate.sh's own self-test exists to refuse.
      #
      # So the self-test asserts the derivation is non-empty and finds named
      # guards, that a missing workflow file derives ZERO (so the caller's
      # refusal is reachable), and that every guard in the repo-wide set is
      # both a real npm script and actually wired into CI — a set member that
      # is neither would be a guard nothing runs, protected from narrowing.
      - run: npm run test:run-guards

      # AGL-2486. Where the continuous gate's verdict lands. This one was
      # written as a GitHub issue that is opened on red and closed on green,
      # and that sink is structurally dead here — the repository has issues
      # AND discussions disabled, so every red would have died at
      # `gh issue create` and read as a broken step rather than a missing
      # verdict. It writes commit statuses instead.
      #
      # The self-test covers the decision that inline YAML got wrong: a job
      # that SKIPPED every step reports `success`, and reading that as green
      # clears the red on a `main` nobody happens to be pushing to — the
      # tracking state marking itself healthy exactly because nothing was
      # checked. `inconclusive` writes no status, so the prior verdict stands.
      - run: npm run test:gate-report

      # AGL-1882. The comparator behind `check:backup-copies`, which asks the
      # one question `/api/health/backups` structurally cannot: does ANY copy
      # of production data live outside the production GCP project? Every
      # probe that endpoint makes is a probe from inside the thing that would
      # be lost, and on 2026-08-19 it reported **ok** while all three copies
      # sat in `aglyn-main`.
      #
      # Only the pure half runs here — the live half needs a Storage
      # credential and is scheduled in backup-copies.yml. This half matters on
      # its own because the verdict's GREEN branch is one production cannot
      # currently produce: with no off-project copy in existence, a check run
      # only against reality would never once execute its own success path.
      - run: npm run test:backup-copies

      # AGL-2089. The versioning rules that decide what number a release
      # carries. Pure string logic, no git — so it runs anywhere, and its
      # dangerous failure mode is a plausible-looking wrong bump rather than a
      # crash. Registered in rules-drift.test.mjs's wiring allowlist like the
      # rest, so deleting this step turns both drift workflows red.
      - run: npm run test:release-version

      # AGL-2108. Two steps in the AGL-2021 order: the unit test proves the
      # comparator can FAIL (a half-repaired lockfile, both fields stale), and
      # only then is the repo-wide scan's green worth anything. The drift it
      # reads — package.json vs package-lock.json `version` — is one NOTHING
      # else reads: `npm ci` validates the dependency set, not the root
      # version, so the repo carried `1.0.0-alpha.0` through an entire release
      # with every check green.
      - run: npm run test:manifest-versions

      - run: npm run check:manifest-versions

      # AGL-1278. Same two-step order. `/pricing`'s compare table is ~400
      # cells generated from `plan-entitlements.ts`; the generator shipped with
      # NO consumer — not an nx target, not a CI path, not a package script —
      # so when AGL-2133 retired the `totalSiteSizeMb` entitlement and removed
      # the row, the committed `pricing-copy/tables.json` went on publishing a
      # storage cap for an entitlement that no longer exists, and nothing in
      # the repo could fail on it. The generator also wrote its output BEFORE
      # reconciling and never exited non-zero, so its "the disagreement is
      # printed" invariant could not gate anything. The unit test proves the
      # reconciler now fails on each shape (a wrong cell, a dropped row, an
      # undeclared extra row, a malformed record, a dead exemption, a stale
      # output), and only then is the check's green worth anything.
      #
      # The `libs/**` path filter above is load-bearing here, not incidental:
      # this reads `libs/aglyn/src/lib/app-utils/plan-entitlements.ts`, so an
      # entitlement edit must trigger the guard that catches the stale output
      # it produces. That is exactly the commit that went unnoticed.
      - run: npm run test:pricing-tables

      - run: npm run check:pricing-tables

      # AGL-1296. The detector half only — the corpus it audits is authored
      # node data in Firestore, so `npm run audit:marketing-containers` needs
      # ADC on `aglyn-main` and cannot run on a PR. What CAN run here is proof
      # that the detector fails on the shapes AGL-1298 banned: a bespoke `sx`
      # pixel cap (the 1328px the deleted one-shot script wrote) and a
      # `props.maxWidth` that is not one of MUI's six prebuilt values.
      #
      # Worth stating plainly rather than implying more coverage than exists:
      # this does NOT measure the live site. It replaces a COMMENT — the
      # "/pricing audit measured 8/8 sections on maxWidthXl" line in
      # container.spec.tsx — with a detector whose failure path is exercised,
      # so the census a human runs is worth reading.
      - run: npm run test:marketing-containers

      # AGL-1298 / AGL-2360. The sibling guard above holds the ban in DATA;
      # this holds it in the DOCS, and the docs were the half that rotted.
      # `product-page-skeleton.md` went on prescribing `sx {maxWidth: '1328px'}`
      # as an invariant — with "not `'xl'` (1536)" spelled out — for ten days
      # after the sweep that removed all 144 of them.
      #
      # And the column it justified that with, 1280, appears in NO recorded
      # measurement of any frame: the extracts measure 1392 at 1440, 1488 at
      # 1920, 688 at 768. Stock `xl` caps at min(viewport, 1536) less its own
      # gutters, so it renders 1392 and 1488 — the design exactly, at both
      # desktop widths. An agent reading the old doc concludes the LIVE SITE is
      # too wide and that the red container spec is what to relax, and narrows
      # a site that had nothing wrong with it.
      #
      # The invariant guarded is "stock `xl`", NOT a pixel figure — 1536
      # included; `xl` never renders 1536 of content at any breakpoint.
      #
      # Two-step order as everywhere else here: the unit test proves the
      # detector goes red on the exact wording that stood (including the
      # control that its blockquote and fenced-code exemptions are not holes),
      # and only then is the real scan's green worth reading. The scan is
      # markdown only — it does not measure the site, the node corpus, or
      # Figma.
      - run: npm run test:marketing-width-doctrine

      - run: npm run check:marketing-width-doctrine

      # AGL-2124. Same two-step order: the unit test proves the scanner can
      # FAIL on the exact three literals (its first version reported green over
      # one of them — a `//.*$` comment strip eats everything after the `//` in
      # `https://`), and only then is the repo scan's green worth anything.
      # apps/docs ships in the open-source distribution, so a literal here
      # makes an operator's readers, stack traces and uptime report to US.
      - run: npm run test:docs-self-host

      - run: npm run check:docs-self-host

      # AGL-1950. Same two-step order. Docusaurus' `onBrokenLinks: 'throw'`
      # does NOT cover static assets — an asset under `static/` is copied, not
      # resolved — so a page pointing at a screenshot that was never captured
      # builds green and ships a broken-image icon. Worse, a capture harness
      # that fails mid-shot writes a VALID PNG of empty backdrop, which passes
      # any check that only asks whether the path resolves. The unit test is
      # what proves the scanner reds on both, and on the 0-byte case, before
      # the repo scan's green means anything.
      - run: npm run test:docs-screenshots

      - run: npm run check:docs-screenshots

      # AGL-2400. Same two-step order, and the unit test carries the whole
      # burden of proof here: a `@aglyn.com` address that was never created
      # ACCEPTS mail and suppresses the bounce (AGL-1577), so the corpus scan
      # going green is not evidence the addresses in it are real — only that
      # they are all in the registry. The test is what proves the scan can
      # still fail, by pointing it at an address the registry does not hold.
      - run: npm run test:contact-addresses

      - run: npm run check:contact-addresses

      # AGL-2300. Same two-step order. Four DOMPurify Dependabot alerts are
      # DISMISSED on the claim that monaco never turns on the config surfaces
      # those advisories need — not on the vendored copy being unused, which it
      # is not. Nothing checked that claim: it was a one-time grep, and monaco
      # already changed behaviour under us once this week. The unit test proves
      # the detector can tell the library READING an option from monaco PASSING
      # one, and only then is the scan of the real bundle worth anything.
      - run: npm run test:monaco-dompurify

      - run: npm run check:monaco-dompurify

      # AGL-2021. Two steps, and the order matters: the self-test proves the
      # comparator can still FAIL (it reconstructs the forbidden Webfile number
      # from its own digest and asserts the scanner flags it), and only then is
      # the repo-wide scan's green worth anything. A guard that cannot fail is
      # the exact false green this repo has been bitten by.
      #
      # The `paths:` filter above was widened to apps/libs/cloud/docs/.claude
      # for this step specifically — a commit touching only apps/console must
      # trigger the guard that scans apps/console. The daily cron is the
      # backstop for anything the filter still misses.
      - run: npm run test:no-tax-identifiers

      - run: npm run check:no-tax-identifiers

      # AGL-1491. Same two-step order, same reason, a different needle: the
      # pre-move residential address. On 2026-08-24 four tracked spec files
      # were found publishing it — three of them in one sweep, all of them
      # `platformRevenue` fixtures pasted from a live Stripe invoice — and
      # nothing was watching, because check:no-tax-identifiers guards the
      # Comptroller identifiers and check:contact-addresses guards mailboxes.
      #
      # The unit test carries the burden of proof and drives the whole
      # red/green matrix through SYNTHETIC needles, so neither it nor the
      # guard ever holds the real value. It also pins the one false green this
      # design is exposed to: each needle stores a cheap prefilter beside its
      # digest, and a prefilter that disagrees with its digest would filter
      # every window out before hashing and go permanently, silently green.
      #
      # Note this scans file CONTENT only. A commit MESSAGE carrying the
      # address is just as public and is not covered here or anywhere.
      - run: npm run test:residential-address

      - run: npm run check:residential-address

      # A named individual's account identifiers. Same two-step order and the
      # same digest design as the two above, and it exists because neither of
      # them — nor check:contact-addresses — could see this class at all: one
      # guards Comptroller numbers, one guards a street address, and the third
      # EXEMPTS every spec and test path, which is where twenty-five of the
      # sixty leaking files were.
      #
      # It scans every tracked file, specs included, so its trigger is the same
      # widened apps/libs/cloud/docs filter the two above rely on.
      - run: npm run test:personal-identifiers

      - run: npm run check:personal-identifiers

      # AGL-1956. On 2026-08-24 Aglyn accepted marketplace-facilitator status
      # and published ToS §10.7, which tells every merchant that on a
      # storefront sale the tax "is collected into Aglyn's processor account,
      # is not transferred to your connected payment account, and is remitted
      # by Aglyn to the taxing authority." That is not a policy sentence — it
      # is a description of four Stripe parameters, and nothing checked them.
      #
      # The defect that issue closed was ONE wrong parameter pairing:
      # `application_fee_amount` beside `automatic_tax[enabled]` on a
      # destination charge, which transfers `amount_total − fee` to the
      # merchant while `amount_total` has Aglyn's sales tax inside it. Both
      # keys are individually correct, the session is created, the shopper is
      # charged the right total, and every downstream number stays plausible.
      # No unit test on a single call site can see it, because the defect is a
      # RELATIONSHIP between two keys in one request.
      #
      # The AGL-1956 close-out recorded that five charge sites hand-roll their
      # Connect parameters rather than calling the one emitter, so that
      # module's claim to be the single emitter "is not true of the codebase",
      # and that a guard was warranted but was not built inside the freeze.
      # This is that guard: the note as an exit code.
      #
      # Self-test first, as everywhere else here — and it earns the order.
      # This guard's scanner has to tell a Stripe parameter from a COMMENT
      # about a Stripe parameter, in a repository whose comments discuss
      # `on_behalf_of` and `Stripe-Account` at length precisely because they
      # must never be sent. A scanner that could not draw that line would
      # either fire on every explanatory comment or be silenced into
      # uselessness, so the self-test pins both directions before the sweep's
      # green is worth anything.
      - run: npm run test:facilitator-charge-shape

      - run: npm run check:facilitator-charge-shape

      # AGL-1908. The Pricing Source of Truth's change-control rule requires a
      # price or entitlement change to move together across six places, the
      # last being the Decision Log. Five of the six are outside the repo and
      # cannot be checked from here — Stripe, Figma, the hand-authored
      # `aglyn.com/pricing` besigner content, `setup-stripe.mjs`'s
      # hand-maintained copy, and the Drive Source of Truth. The sixth can be,
      # and for nine days nothing did: the log went 2026-08-09 → 2026-08-18
      # while the entire retention/packaging arc landed in between.
      #
      # The rule then started costing more than it collected. On 2026-08-24 an
      # agent found a live entitlement leak, and one of its three reasons for
      # declining to close it was that doing so is an entitlement change and
      # "AGL-1908's change-control rule requires publication legs I cannot
      # do". An unenforced rule that blocks a real fix is the worst of both, so
      # the rule is now an exit code and the log is a file in this repo.
      #
      # Self-test first, and it earns the order here for a specific reason:
      # this guard compares PARSED VALUES between refs, not changed paths. A
      # path-level version would have demanded a pricing decision for
      # `d393d34a9` — a docblock — and a guard people learn to route around is
      # worse than none. The self-test pins that a comment-only change stays
      # green while a moved price, a moved entitlement and a moved COGS rate
      # each go red, so the sweep's green means the thing it claims.
      - run: npm run test:decision-log

      - run: npm run check:decision-log

      # The feature matrix is GENERATED from `PLAN_ENTITLEMENTS` (AGL-1152).
      # Without this the published table drifts silently the first time a
      # feature moves between plans and nobody remembers the doc — which is
      # exactly how `mediaCdn` came to be gated on paid tiers with no record of
      # it anywhere in Pricing & Packaging. A stale matrix is worse than an
      # absent one: it is a table people trust.
      - run: npm run check:feature-matrix

      # AGL-2025. Unlike every step above, these two are about the CONTENT of
      # apps/ and libs/, not about tools/ — which is why the `paths:` filter
      # gained those two roots. A colour pinned into `libs/plugins` cannot
      # trigger a workflow that only watches `tools/**`.
      - run: npm run test:hardcoded-colours

      - run: npm run check:hardcoded-colours

      # AGL-1621. Same two-step order, and the reason is the sharpest one in
      # this file: on 2026-08-23 a scripted edit dropped a closing paren from
      # two `hasAny(…)` expressions in cloud/firebase-firestore.rules and the
      # ENTIRE suite stayed green. The three deny-coverage guards read the
      # rules as text and assert about FIELD NAMES — the `hasAny` regex reads
      # between `[` and `]` and cannot care what follows the `]`, and the
      # block walkers count braces, never parens. 47 assertions passed against
      # a file the Firestore compiler rejects. A human reading the diff caught
      # it.
      #
      # `npm run test:rules` does compile the file, but it lives in
      # emulator-guards.yml, whose push trigger moved to `production` in the
      # freeze — as did rules-drift.yml's. So on `main` NOTHING answered "does
      # this file parse", on the file that is the last line of defence for
      # every customer's document.
      #
      # The self-test first, and it is not ceremony: its fixtures include the
      # exact dropped-paren mutation, plus the shapes the scanner must NOT
      # fire on (delimiters inside comments and strings, and the AGL-2004
      # phantom-block-comment case). A balance scanner that cried wolf on the
      # real 141KB file would be deleted within a day, and then nothing would
      # check again.
      #
      # No JVM is added to this job on purpose. The guard's structural tier —
      # the tier that catches this bug class — is pure node and runs in
      # milliseconds; its second tier compiles with the real Rules compiler
      # through the emulator's upload endpoint and engages automatically
      # wherever `firebase` + `java` already exist (a developer's machine,
      # tools/gate.sh, emulator-guards.yml). The output always STATES which
      # tiers ran, so a green here is never mistaken for a grammar check.
      - run: npm run test:rules-parse

      - run: npm run check:rules-parse

      # AGL-2486. `compiler.reactRemoveProperties` deletes JSX props from the
      # BROWSER build only, and jest's transform keeps them — so a prop being
      # erased in production still renders under test and its spec passes.
      # `displayName` sat in that list and silently blanked a real prop at
      # eight call sites for weeks. This is the only place that list is read.
      - run: npm run test:react-remove-properties

      # AGL-2486. The workspace version may not go backwards. An unrelated
      # commit carried package.json from 1.0.0-beta.7 down to 1.0.0-beta.6 on
      # 2026-08-20 and it stood for three days, with v1.0.0-beta.7 tagged and
      # every build — production included — reporting beta.6.
      - run: npm run test:version-monotonic

      # Brand-literal ratchet (AGL-2170), the same shape and the same sweep
      # roots as the colour one above. AGL-2153 made the platform brand
      # configuration so a self-host operator can rename the product without
      # editing source; this is what stops the next hardcoded "Aglyn" from
      # being written into user-visible copy by someone with no reason to know
      # that. Its detector is unit-tested separately, because a ratchet whose
      # detector is wrong is a number nobody can act on.
      - run: npm run test:brand-literals
      - run: npm run check:brand-literals

      # The shared-ui-jsx barrel allowlist (AGL-1895). Same reason as the two
      # ratchets above for living here rather than only in nx-ci.yml, and one
      # more: it is about the CONTENT of libs/, so `libs/**` in the `paths:`
      # filter is what makes it able to see its own regression.
      #
      # AGL-1290 established that everything reachable from
      # `libs/shared/ui/jsx/src/index.ts` ships eagerly on EVERY published
      # customer page, wrote the rule down in a comment, and a comment cannot
      # fail. This is that rule as an exit code. Its detector is unit-tested
      # separately — five of those tests are forced reds against the real
      # module graph, because a gate nobody has watched fail is a gate nobody
      # knows the shape of.
      - run: npm run test:jsx-barrel
      - run: npm run check:jsx-barrel

      # The same rule for the OTHER barrel a published page imports statically
      # (AGL-2486). `catch-all-client.tsx` opens with `import * as Aglyn from
      # '@aglyn/aglyn'`, and nothing watched that entry — which is how
      # `firebase/auth` and `acorn` each came to ship to anonymous visitors of
      # every customer site, for -48,643 B and -39,035 B gzipped respectively.
      # Its forced reds live in the same test file and replay exactly those two
      # regressions, so the gate is known to catch the thing it was built for.
      - run: npm run check:aglyn-barrel

      # The byte budget the two allowlists above cannot express (AGL-2486
      # follow-on). A published page's first-party first-load graph, summed as
      # source bytes and pinned with 25% headroom. Static edges only: an
      # `import()` is a chunk a visitor pays for only when a branch asks, so
      # counting it would score a deliberate lazy boundary as no improvement.
      - run: npm run test:tenant-page-weight
      - run: npm run check:tenant-page-weight

      # The PRICE that weight is charged at. `perPageView` is a cost per page
      # view billed at cost + 30%, and the budget above cannot see that the
      # rate was calibrated against a page the code no longer builds. This
      # pins the rate to the recorded wire measurement, and the measurement to
      # the module graph it was taken against.
      - run: npm run test:page-view-rate
      - run: npm run check:page-view-rate

      # NEXT_PUBLIC access form (AGL-2037, AGL-2172). Next substitutes only the
      # dot form, so a bracket read in a client-reachable module is `undefined`
      # in the browser and the value silently falls back to Aglyn's default —
      # which is how a self-hoster's custom-domain wizard came to print OUR
      # CNAME target and Vercel's IPs to their customer. Deliberately NOT a
      # jest guard: in Node both access forms are the same property read, so a
      # spec cannot see this class at all, and one written to try would be
      # green for an unrelated reason.
      - run: npm run check:next-public-access

      # AGL-2376 / AGL-2377. The guard that catches the thing this whole
      # workflow is an answer to, from the OTHER end: a test file with no
      # runner, and a `test` target with no tests.
      #
      # It found six orphans on its first real run — five Firestore rules specs
      # sitting directly in `cloud/` with 31 live assertions about who may read
      # a billing document, plus the backfill `applyPlan` suite — none of them
      # executed by anything, one edited the day before. And five nx `test`
      # targets over source trees with no spec file at all, which exit 1 with
      # "No tests found" whenever they are affected.
      #
      # Two-step order as everywhere else here. The self-test matters more than
      # usual: this guard's entire subject is checks that cannot fail, and its
      # own first version could not — it globbed `cloud/**/*.spec.mjs`, which
      # git does not match against a file sitting directly in `cloud/`, so it
      # reported green over all five of the orphans it was written for. The
      # suite now pins both glob depths.
      #
      # ⚠️ The remedy for an empty target is a spec, or removing the target and
      # declaring it in UNTESTED_PROJECTS. It is NOT `passWithNoTests` — that
      # flag turns "asserts nothing" into a green indistinguishable from real
      # coverage, so the guard refuses it outright.
      - run: npm run test:test-wiring

      - run: npm run check:test-wiring

      # AGL-2376. `applyPlan`'s refusals — update() on a missing doc FAILS,
      # create() on an existing doc FAILS, an unknown op is refused outright.
      # These are the guards that stop a backfill conjuring a record or
      # overwriting a live one, and every other tools/scripts/lib/*.test.mjs
      # (21 of them) already had an npm script. This one alone did not, so 17
      # passing tests about destructive writes ran nowhere.
      - run: npm run test:backfill-core

      # AGL-2379. The pure-node self-test for the legal-drift comparator. The
      # comparator itself needs the live site AND Drive credentials, so it runs
      # on a schedule in legal-drift.yml rather than here — but its 40-test
      # self-test needs nothing, and a comparator that has stopped comparing
      # reports "no drift", which is indistinguishable from convergence.
      - run: npm run test:legal-drift

      # AGL-1986. The comparator behind `check:legal-index-dates`, which
      # re-derives every /legal index card's date from the document that card
      # links to. The nine cards are hand-typed besigner nodes restating a
      # date the document below them also states, and ToS §5.3 / Privacy §12
      # make that date the mechanism by which amended terms take effect — so a
      # forgotten card is a second, contradictory claim about when the current
      # terms began to bind, on the page a user lands on first.
      #
      # Only the SELF-TEST runs here; the check needs the live pages and runs
      # in legal-drift.yml. It pins the four traps, and the reason it has to:
      # a comparator that stops comparing reports "no drift", and two
      # SPELLINGS of one day ("August 5, 2026" vs "5 August 2026") must not
      # read as drift while two different days must.
      - run: npm run test:legal-index-dates

      # AGL-2036. The reconciler behind `check:shipped-not-closed`, which lists
      # open Linear issues whose implementing commits are already live.
      #
      # On 2026-08-18 the `awaiting-smoke` label queue was EMPTY while five
      # issues sat labelled `awaiting-promotion` after they had already
      # shipped, and ~30 more In Review issues whose commits were in production
      # carried no blocking label at all — invisible to every label-defined
      # sweep. A label-defined queue only holds while somebody remembers to
      # apply the label, so the queue has to be defined by STATE and
      # re-derived. This is the code that re-derives it.
      #
      # Only the SELF-TEST runs here. The check itself needs the list of
      # started-state issues, which comes from an argument (or LINEAR_API_KEY,
      # which is set nowhere) — and a guard gated on a credential nobody has
      # set is a guard that never runs, which is how legal-drift spent its
      # first day (AGL-2379). The self-test is pure node and pins the four
      # traps that each produced a wrong answer by hand: attributing a commit
      # that merely MENTIONS an issue, double-counting a rebase twin, calling a
      # part-promoted issue shipped, and reading ancestry as deployment.
      - run: npm run test:shipped-not-closed

      # AGL-2193. The other half of the same problem, and the bigger half: six
      # of today's 38 launch blockers were already complete and still open, and
      # NONE of them was closed by a commit, so the check above could never
      # have seen any of them. `check:external-facts` re-reads the external
      # fact each issue is actually waiting on.
      #
      # Only the self-test runs here — the check itself needs LINEAR_API_KEY
      # and the network; `external-facts.yml` owns the daily live run. What
      # this pins is the one thing that must never regress: a bot-protection
      # challenge, a 200 shell, a DNS failure and a malformed block all report
      # UNKNOWN and never a verdict. `aglyn.com` challenges every non-browser
      # client on every path, and a challenge page contains none of the strings
      # an assertion looks for — so a two-state comparator PASSES every
      # `expect-absent` assertion vacuously, silently, on the happy path.
      - run: npm run test:external-facts

      # AGL-2500. The third member of that family, and the only one whose
      # CHECK can run here rather than just its self-test — which is the whole
      # design. Both guards above are gated on LINEAR_API_KEY and so run
      # nowhere; this one compares against a CACHED CEILING checked into the
      # repo, needs no credential and no network, and therefore actually
      # executes on every run.
      #
      # What it refuses: an `AGL-nnnn` above the highest issue that exists, in
      # a commit message or in source. On 2026-08-28 fourteen commits landed
      # on `main` citing AGL-2508..AGL-2521 against a workspace topping out at
      # AGL-2499, and the same ids reached ~100 source comments. A commit
      # citing a non-existent issue is worse than one citing none: it tells the
      # reader there is context to find and sends them to a 404. The next
      # release would also have published fourteen dead Linear links into
      # CHANGELOG.md, which generates them from these very messages.
      #
      # ⚠️ The ceiling goes STALE by design — it starts refusing REAL issues
      # once the workspace passes it. That is the intended trade against the
      # alternative (fail open when Linear is unreachable, which is a guard
      # that catches nothing), and it is handled rather than hoped about: the
      # check prints the ceiling's age on every run and the exact hand-edit
      # that raises it. Refresh it deliberately, from the workspace — NEVER to
      # whatever number just failed.
      - run: npm run test:linear-ids
      - run: npm run check:linear-ids

      # AGL-1489. The four deploy scripts all SHIP SOMETHING when they run, and
      # three of them read a single flag with `process.argv.includes(...)` and
      # discarded everything else — so `deploy-firestore-rules.mjs --help`
      # deployed the live Firestore rules. This guards the shared parser AND the
      # wiring: a call site that goes back to scanning argv fails here, because
      # the parser being correct is worth nothing if the script does not use it.
      - run: npm run test:deploy-args

      # AGL-1877. The Texas data-processing tax code (`txcd_10103001`) on
      # Aglyn's own Stripe products — the single input that decides how much
      # sales tax is collected and remitted from Sep 1. It was set by hand in
      # the Dashboard and appeared NOWHERE in this repository, so a tier added
      # by `setup-stripe.mjs` shipped taxed on the full base while every tier
      # before it was taxed on 20%, and no TEST-mode product carried it at all
      # — meaning the one environment safe to rehearse tax in was rehearsing a
      # different position. This pins the string and the detector; the live
      # account is checked by `setup-stripe.mjs --dry-run`, which needs a key.
      - run: npm run test:stripe-tax-code

      # AGL-2379 / AGL-2240. A SECURITY control that ran in no workflow: it
      # walks the Next app-router module graph and proves no model-provider key
      # (ANTHROPIC_API_KEY) is reachable from the client closure, and that none
      # is read under a `NEXT_PUBLIC_` prefix — which publishes the VALUE by
      # definition, with no import needed.
      #
      # It is NOT the subprocessor gate. That spec enumerates every file that
      # NAMES the key, and cannot see this: an allowlisted reader that gains a
      # `'use client'` directive leaves the file set unchanged while the key
      # compiles into JavaScript served to every visitor. The question there is
      # which files; here it is which graph.
      #
      # Belongs here rather than beside its sibling `check:app-router-graph` in
      # nx-ci.yml: this is the workflow whose steps the AGL-1822 wiring block
      # in rules-drift.test.mjs actually asserts, so deleting this step turns
      # three other active workflows red.
      - run: npm run check:provider-key-exposure

      # AGL-1890. No tracked source file may contain a raw NUL byte.
      #
      # A NUL in a blob's first 8000 bytes makes the file BINARY to git: no
      # diff, no `git log -p`, no blame, and `grep` skips it. That is not a
      # cosmetic problem — it means NO change to that file has ever been
      # reviewed, including whatever is in it right now.
      # `apps/console/utils/analytics-day-cache.ts` landed that way and stayed
      # unreviewable for six days over 6.7 KB of caching logic; read as text
      # for the first time, it held two real defects.
      #
      # AGL-1323 removed the repo's one known instance and recorded that it
      # was the only one. Two more arrived within fifteen days, because
      # nothing stopped them — that issue left a fact, and a fact cannot fail.
      # This is that fact as an exit code.
      #
      # Stricter than git on purpose: it flags a NUL at ANY offset, not only
      # inside git's window. The second offender sat at byte 9188, where git
      # still called the file text — a landmine that flips the whole file to
      # binary on the next edit that grows anything above it, on a commit with
      # no visible relationship to the cause.
      #
      # Two steps, self-test first, as everywhere else here: the self-test
      # rebuilds both real offenders and asserts they are caught, so the
      # repo-wide green that follows is worth something.
      - run: npm run test:nul-bytes

      - run: npm run check:nul-bytes

      # AGL-2480 — eslint over `tools/` itself. There is no `tools/project.json`,
      # so `tools/` is in NO nx project and `nx affected -t lint` has never
      # reached one of its 214 `.mjs` files. That is the whole tree this
      # workflow's other twenty-odd guards are WRITTEN IN: the drift checkers,
      # the deploy tooling, the erase-org CLI, all eight local lint rules.
      #
      # The root config already has a `**/*.mjs` block written for exactly
      # these files — AGL-1815 added it, and its comment names
      # `tools/scripts/**` by hand as the reason. Nothing has ever run it over
      # them. It found 18 real errors on the first pass, six of them
      # `preserve-caught-error` in the network and filesystem paths of the
      # deploy tooling, where the discarded `cause` is the ENOENT or the
      # connect-timeout an operator needs to see.
      #
      # Here rather than in a `tools/project.json` on purpose: adding an nx
      # project to hold a lint target would put `tools/` in the project graph
      # and subject it to `@nx/enforce-module-boundaries`, which is a much
      # larger change than running a linter. This workflow is already the
      # unconditional home for every other pure-node `tools/` guard.
      - run: npm run check:lint-tools
