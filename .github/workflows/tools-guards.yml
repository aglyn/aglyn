name: Tools guards

# Runs the seven pure-node `tools/` guard suites whose only other home is
# nx-ci.yml — which is `disabled_manually` and runs on no runner, so every
# gate added to it since it was switched off has never executed once
# (AGL-1776/AGL-1816/AGL-1822). These suites are secretless, dependency-light
# and seconds each; this workflow is their one cheap ACTIVE home.
#
# What each guards:
#  - test:eslint-rules        the seven local ESLint guard rules' RuleTester
#                             suites (the RULES run at every `nx lint`; their
#                             self-tests otherwise run nowhere)
#  - test:plugin-loader       the sandbox CSP the plugin origin serves (AGL-1092)
#  - test:disk-space          the dev-loop preflight that can fail every serve
#                             target at once (AGL-1425)
#  - test:deploy-guard        the clean-deploy-source guard that decides what
#                             ships (AGL-1778)
#  - test:erase-cli           the org-erase CLI that decides what gets
#                             destroyed (AGL-1778)
#  - test:standalone-installs the enumerated-standalone-packages policy
#                             (AGL-1781)
#  - test:release-version     the semver/bump/changelog rules a release
#                             depends on (AGL-2089) — a wrong bump does not
#                             throw, it just mints a wrong number forever
#  - test:manifest-versions   / check:manifest-versions  the package.json vs
#                             package-lock.json version agreement (AGL-2108) —
#                             a drift `npm ci` does not read and the promotion
#                             gate stayed green over for a whole release
#  - test:docs-self-host      / check:docs-self-host  apps/docs must not
#                             compile in our GA id, our error collector or our
#                             production origins (AGL-2124) — it ships in the
#                             open-source distribution
#  - check:standalone-installs  asserts every nested package with its own
#                             lockfile has an install step in nx-ci.yml. That
#                             file is currently disabled; the check still
#                             matters because it keeps the TEXT complete for
#                             the AGL-1776 re-enable decision, and because a
#                             THIRD standalone package landing without any
#                             install step is invisible on every dev checkout
#                             (nested node_modules mask it). Run from HERE —
#                             an active workflow — the assertion is about a
#                             file's content, not about this workflow, so it
#                             is not circular.
#
# tools/ is not an nx project, so `nx affected` cannot reach any of these and
# no Nx Cloud involvement exists here (the thing nx-ci.yml was disabled over).
# The paths filter below is the cheap approximation of affected-ness.
#
# NO nested installs: apps/docs and cloud/functions are standalone packages a
# root `npm ci` does not reach (AGL-1781) — but none of these seven suites
# imports from either, so this workflow deliberately does not pay for their
# installs. If a suite ever grows such an import, add the matching
# `npm ci --prefix <dir>` line rather than working around the failure.
#
# Anti-circularity (the AGL-1804/AGL-1816 precedent): "this workflow runs the
# seven suites" is asserted from OUTSIDE this file, in
# tools/scripts/lib/rules-drift.test.mjs — a suite that rules-drift.yml and
# index-drift.yml (both active) each run. Deleting a step here turns both
# drift workflows red. The `npm run test:rules-drift` step below runs that
# same suite HERE as well, so an edit to this file that drops a guard step
# goes red on the very push that makes it (this workflow triggers on itself),
# not a day later on the drift workflows' schedules.
#
# ⚠️ Do NOT move these steps into nx-ci.yml, and do not make any step here
# conditional. A skipped check that renders green is the silent failure mode
# the whole AGL-1776 audit was about. Exit codes propagate naturally — never
# pipe a gate command.

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      # AGL-2025: `check:hardcoded-colours` sweeps apps/ libs/ cloud/, so its
      # trigger has to be the code it measures. Watching only `tools/**` is
      # what made the retired-colour census structurally unable to see the 161
      # literals in `libs/plugins` — a guard that runs only when the guard
      # changes cannot catch a regression in the thing it guards.
      - 'apps/**'
      - 'libs/**'
      - 'cloud/**'
      # The scripts themselves are defined here.
      - package.json
      - package-lock.json
      # test:ttl-policies compares the TTL script against this doc's table, so
      # a doc-only edit must trigger the guard that would catch the mismatch.
      - docs/FIRESTORE_MANUAL_CONFIG.md
      # check:standalone-installs asserts against nx-ci.yml's text — an edit
      # deleting an install step must trigger the check that would catch it.
      - .github/workflows/nx-ci.yml
      - .github/workflows/tools-guards.yml
      # AGL-2021: check:no-tax-identifiers scans every TRACKED file, so its
      # trigger cannot be narrower than the trees a forbidden identifier could
      # land in. Without these, a commit touching only apps/console — exactly
      # where the identifiers lived — would not run the guard that catches it.
      # This does make the workflow run on most pushes; the eight other guards
      # here are seconds each and the job is secretless, which is the trade
      # that makes it affordable.
      - 'apps/**'
      - 'libs/**'
      - 'cloud/**'
      - 'docs/**'
      - '.claude/**'
  schedule:
    # Daily, 07:53 UTC — off the top of the hour, where GitHub's scheduler
    # congestion is worst, and after the two drift workflows (07:23, 07:41)
    # so the three do not contend for the same npm cache warm-up.
    # (GitHub schedules are best-effort and pause on 60-day-quiet repos; a
    # green history is not proof of continuous coverage.)
    - cron: '53 7 * * *'
  workflow_dispatch:

concurrency:
  # Only the newest verdict matters; a delayed run must not pile up.
  group: tools-guards
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 is REQUIRED, not a nicety (AGL-1920). `test:rules-drift`
      # below builds its promotion-window fixture from real history — the last
      # commit touching cloud/firebase-firestore.rules, and that commit's
      # PARENT. A shallow clone has neither, and worse, it lies rather than
      # erroring: the graft commit has no parents, so every file reads as
      # newly added in it and `git log -1 -- <path>` returns HEAD itself.
      # `<HEAD>^` then does not resolve, the self-test fails, and because it
      # is the FIRST guard step every suite below it is skipped — this
      # workflow rendered red while checking nothing, for four days.
      # check:standalone-installs only needs `git ls-files`; this is for the
      # drift self-test. rules-drift.yml has always fetched full history for
      # the same reason.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Root install only — see the no-nested-installs note above. The
      # RuleTester suites need eslint/@typescript-eslint from here; everything
      # else is node builtins + files in tools/.
      - run: npm ci

      # The wiring guard, first: this suite asserts (among its own comparator
      # tests) that THIS workflow still runs all seven guard steps below, so a
      # broken wiring fails the job before any partial green is printed. Its
      # other homes are rules-drift.yml and index-drift.yml — see the
      # anti-circularity note above.
      - run: npm run test:rules-drift

      - run: npm run test:eslint-rules

      - run: npm run test:plugin-loader

      - run: npm run test:disk-space

      - run: npm run test:deploy-guard

      # AGL-2014 — holds tools/scripts/set-firestore-ttl.mjs to the TTL table in
      # docs/FIRESTORE_MANUAL_CONFIG.md. The script is the only reproducible way
      # a self-host install gets TTL policies, and it had drifted to one of the
      # documented eight. Triggered by the `docs/FIRESTORE_MANUAL_CONFIG.md`
      # path added above, so editing the doc alone still runs it.
      - run: npm run test:ttl-policies

      - run: npm run test:erase-cli

      - run: npm run test:standalone-installs

      - run: npm run check:standalone-installs

      # AGL-2089. The versioning rules that decide what number a release
      # carries. Pure string logic, no git — so it runs anywhere, and its
      # dangerous failure mode is a plausible-looking wrong bump rather than a
      # crash. Registered in rules-drift.test.mjs's wiring allowlist like the
      # rest, so deleting this step turns both drift workflows red.
      - run: npm run test:release-version

      # AGL-2108. Two steps in the AGL-2021 order: the unit test proves the
      # comparator can FAIL (a half-repaired lockfile, both fields stale), and
      # only then is the repo-wide scan's green worth anything. The drift it
      # reads — package.json vs package-lock.json `version` — is one NOTHING
      # else reads: `npm ci` validates the dependency set, not the root
      # version, so the repo carried `1.0.0-alpha.0` through an entire release
      # with every check green.
      - run: npm run test:manifest-versions

      - run: npm run check:manifest-versions

      # AGL-2124. Same two-step order: the unit test proves the scanner can
      # FAIL on the exact three literals (its first version reported green over
      # one of them — a `//.*$` comment strip eats everything after the `//` in
      # `https://`), and only then is the repo scan's green worth anything.
      # apps/docs ships in the open-source distribution, so a literal here
      # makes an operator's readers, stack traces and uptime report to US.
      - run: npm run test:docs-self-host

      - run: npm run check:docs-self-host

      # AGL-2021. Two steps, and the order matters: the self-test proves the
      # comparator can still FAIL (it reconstructs the forbidden Webfile number
      # from its own digest and asserts the scanner flags it), and only then is
      # the repo-wide scan's green worth anything. A guard that cannot fail is
      # the exact false green this repo has been bitten by.
      #
      # The `paths:` filter above was widened to apps/libs/cloud/docs/.claude
      # for this step specifically — a commit touching only apps/console must
      # trigger the guard that scans apps/console. The daily cron is the
      # backstop for anything the filter still misses.
      - run: npm run test:no-tax-identifiers

      - run: npm run check:no-tax-identifiers
      # AGL-2025. Unlike every step above, these two are about the CONTENT of
      # apps/ and libs/, not about tools/ — which is why the `paths:` filter
      # gained those two roots. A colour pinned into `libs/plugins` cannot
      # trigger a workflow that only watches `tools/**`.
      - run: npm run test:hardcoded-colours

      - run: npm run check:hardcoded-colours

      # Brand-literal ratchet (AGL-2170), the same shape and the same sweep
      # roots as the colour one above. AGL-2153 made the platform brand
      # configuration so a self-host operator can rename the product without
      # editing source; this is what stops the next hardcoded "Aglyn" from
      # being written into user-visible copy by someone with no reason to know
      # that. Its detector is unit-tested separately, because a ratchet whose
      # detector is wrong is a number nobody can act on.
      - run: npm run test:brand-literals
      - run: npm run check:brand-literals

      # NEXT_PUBLIC access form (AGL-2037, AGL-2172). Next substitutes only the
      # dot form, so a bracket read in a client-reachable module is `undefined`
      # in the browser and the value silently falls back to Aglyn's default —
      # which is how a self-hoster's custom-domain wizard came to print OUR
      # CNAME target and Vercel's IPs to their customer. Deliberately NOT a
      # jest guard: in Node both access forms are the same property read, so a
      # spec cannot see this class at all, and one written to try would be
      # green for an unrelated reason.
      - run: npm run check:next-public-access
