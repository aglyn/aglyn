name: Main Gate

# ---------------------------------------------------------------------------
# CONTINUOUS GATING OF `main` (AGL-2486)
# ---------------------------------------------------------------------------
# On 2026-08-22 the promotion gate came back RED with four unrelated failures —
# a spec-tsconfig type error, a banned word in a new fixture, a latent raw NUL
# byte, and a stale generated pricing table. All four had been sitting on `main`
# for hours. The cost was not the gate's 15 minutes; it was that a promotion
# turned into an unbounded repair session, at the one moment when the answer
# was supposed to be yes or no.
#
# The reason nothing caught them earlier is recorded in nx-ci.yml and
# tools-guards.yml: on 2026-08-20 the `push` trigger on both moved from `main`
# to `production`, because with many agents landing on `main` continuously they
# ran dozens of times an hour and every red raised a notification. CI became
# noise, so it was switched off for `main`, and the note left behind says what
# then happened — "a break can sit on `main` unnoticed until someone runs the
# gate."
#
# Restoring the push trigger would restore the noise. This workflow is the
# other way out of that trade: gate on a TIMER rather than per push.
#
#   - N commits in a window collapse into ONE run and ONE verdict, so the
#     notification rate is bounded by the cadence, not by how many agents are
#     committing. That is the entire noise problem, solved by arithmetic.
#   - The window is small enough that a red still names a short list of
#     suspects instead of a day of them. The summary prints that list.
#   - The verdict lands as a COMMIT STATUS on the gated sha (see `statuses:
#     write` below for why it is not a tracking issue). A break is therefore a
#     visible STATE rather than an email that scrolls away.
#
#     ⚠️ It is a state NOBODY IS NOTIFIED OF, and that is a real gap rather
#     than a nuance (AGL-2533). A status sits on a sha the branch has already
#     moved past, so a red is only ever found by someone who goes looking at
#     that sha. Two reds went unread for hours on 2026-09-03 — a linear-id
#     ceiling violation and a genuine 429-vs-200 assertion failure — and the
#     second was misread as an already-explained flake because nothing
#     surfaced it. Do not treat "Main Gate would have caught it" as meaning
#     anyone would have SEEN it.
#
# ---------------------------------------------------------------------------
# WHY TWO JOBS
# ---------------------------------------------------------------------------
# `fast` is typecheck + docs:typecheck + every derived guard. It finishes in minutes,
# so it runs every 15. `full` adds the test sweep and the PRODUCTION builds and
# runs hourly, because it cannot finish in 15 minutes and pretending otherwise
# just queues runs behind each other.
#
# The split is not a guess about which half matters. ALL FOUR of the 2026-08-22
# failures were in the `fast` half — one typecheck, three guards. That is what
# the cadences are sized against: the class that actually accumulates on `main`
# is the cheap class, and it is worth catching four times an hour.
#
# `full` is still the thing that says a release is safe. Neither job replaces
# `tools/gate.sh`, which is what a promotion runs; these keep `main` in a state
# where running it is uneventful.

on:
  schedule:
    # Every 15 minutes, offset off :00 — GitHub's scheduler is most congested
    # on the hour and schedules are best-effort, so a run may be late or
    # skipped entirely. This is a tightener, not a guarantee; `tools/gate.sh`
    # at promotion time remains the guarantee.
    - cron: '7,22,37,52 * * * *'
    # Hourly for the full sweep, offset again.
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full sweep (tests + production builds)'
        type: boolean
        default: true


env:
  NX_NO_CLOUD: 'true'

permissions:
  contents: read
  # The `moved` step asks the Actions API for the last completed run's head_sha
  # so a quiet weekend does not re-gate the same commit 96 times a day. That
  # read needs `actions: read` — without it `gh api` 403s. The step degrades
  # safely (it falls back to running the gate rather than skipping it), so the
  # failure mode is wasted minutes, not a missed verdict; granting it makes the
  # skip actually work.
  actions: read
  # The verdict lands as a COMMIT STATUS on the gated SHA. It was written as a
  # tracking issue first; that cannot work here and it took one API call to
  # find out — `gh api repos/aglyn/aglyn` returns has_issues:false and
  # has_discussions:false, so every red would have died at `gh issue create`
  # and looked like a broken step rather than a missing verdict.
  statuses: write

jobs:
  fast:
    name: fast (typecheck + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PER-JOB concurrency, not per-workflow, and the difference is the whole
    # 15-minute cadence. A workflow-level group put `fast` and `full` in ONE
    # group, so every quarter-hourly fast run queued behind the HOURLY full
    # sweep — observed live: run 32626327444's fast finished at 07:47 while its
    # full ran on, and the next three fast runs sat pending behind it. The job
    # sized to catch a break within 15 minutes was silently throttled to
    # hourly, which is the one property it exists to provide.
    #
    # NOT cancel-in-progress. AGL-2378's finding still applies: a group holds
    # one running plus at most one pending run, so a third arrival drops the
    # pending one. That is correct for a timer — a superseded scheduled run
    # covers a range the next run also covers — and wrong for a push, where
    # each commit needs its own verdict.
    concurrency:
      group: main-gate-fast
      cancel-in-progress: false
    outputs:
      # Whether this job actually ran its checks. A job that skipped every step
      # still reports `success`, so the report job cannot infer this from the
      # result and must be told.
      verified: ${{ steps.moved.outputs.skip != 'true' }}
      sha: ${{ steps.moved.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Has `main` moved since the last run that produced a verdict? If not,
      # re-running proves nothing new and re-notifies on a red that is already
      # tracked. Cheap to ask, and it keeps a quiet weekend from burning 96
      # runner-hours a day.
      - id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/main-gate.yml/runs?status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Main Gate")][0].head_sha' 2>/dev/null || echo '')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$last" ] && [ "$last" = "$current" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since $last — nothing new to gate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.moved.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # The three trees, for the same reasons nx-ci.yml enumerates: neither
      # apps/docs nor cloud/functions is an npm workspace, and a root-only
      # install fails docs:typecheck and cloud-functions with errors that read
      # as source defects.
      - if: steps.moved.outputs.skip != 'true'
        run: npm ci
      - if: steps.moved.outputs.skip != 'true'
        run: npm ci --prefix cloud/functions
      - if: steps.moved.outputs.skip != 'true'
        run: npm ci --prefix apps/docs

      - if: steps.moved.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.moved.outputs.skip != 'true'
        run: npx nx run docs:typecheck

      # All of them, concurrently. The list is DERIVED from nx-ci.yml and
      # tools-guards.yml by the script itself, so a guard added to either is
      # gated here without anyone editing this file — and deriving zero is a
      # hard failure rather than an empty green phase.
      - if: steps.moved.outputs.skip != 'true'
        run: node tools/scripts/run-guards.mjs --concurrency 4

      # Which commits this verdict covers. On a red, this is the suspect list,
      # and its length is the whole point of gating on a short timer: a day's
      # accumulation is not a suspect list, fifteen minutes of it is.
      - if: always() && steps.moved.outputs.skip != 'true'
        run: |
          {
            echo "### Commits in this window"
            echo
            git log --since='20 minutes ago' --format='- \`%h\` %s (%an)' || true
            echo
            echo "Gated \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"

  full:
    name: full (tests + production builds)
    runs-on: ubuntu-latest
    # Its own group, so a long sweep never blocks the fast cadence above.
    concurrency:
      group: main-gate-full
      cancel-in-progress: false
    # The four things a promotion gate exists to prove, so it inherits the
    # promotion gate's runtime. nx-ci.yml's 60 was measured against `nx
    # affected`; this is run-many over all 40 projects plus three production
    # builds, so it is bounded higher. Do not tighten without measuring the
    # spread — a bound below the real distribution turns honest slow runs into
    # cancellations, which is the AGL-2378 mistake.
    timeout-minutes: 90
    # `inputs.full` is READ here. It was declared and then ignored, so every
    # manual dispatch ran the 90-minute sweep whatever the box said — including
    # a dispatch whose only purpose was to check the fast path. A declared input
    # that nothing reads is worse than no input: the UI offers a choice that
    # silently does not exist.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.full) ||
      github.event.schedule == '11 * * * *'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix cloud/functions
      - run: npm ci --prefix apps/docs

      - run: npm run typecheck
      - run: npx nx run docs:typecheck
      - run: npx nx run-many -t lint --all --parallel=3
      - run: node tools/scripts/run-guards.mjs --concurrency 4
      # The test run, REDIRECTED to a file (AGL-1617). It used to be `| tee`,
      # and the tee was the reason the artifact was useless: a pipe makes
      # nx's stdout ASYNCHRONOUS, and nx ends a failed run with
      # process.exit(), which discards whatever is still in the pipe buffer.
      # Measured both ways:
      #
      #   node -e 'process.stdout.write("x".repeat(5e6)); process.exit(1)'
      #     | wc -c   ->      65,550   (one pipe buffer, the rest dropped)
      #     > file    ->   5,000,009   (a regular file is synchronous)
      #
      # nx prints FAILED tasks last, so the dropped tail was always the
      # failing task's output — this job's run 32718722567 named
      # `console:test` and carried zero ` FAIL ` markers into the artifact,
      # the same signature nx-ci.yml was seeing. The bytes were never
      # written, so neither the artifact nor the digest could recover them.
      #
      # The cost is that the step no longer streams live into the job log;
      # it is `cat` at the end instead. The artifact is the diagnostic path
      # and it is now complete, which it never was.
      - name: test
        run: |
          status=0
          npx nx run-many -t test --all --parallel=3 --maxWorkers=2 \
            > "$RUNNER_TEMP/nx-test.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/nx-test.log"
          exit "$status"

      # --task-failed: this step only runs because the job is already red, so
      # the premise comes from the workflow rather than from a log that may
      # not contain it. A log with nothing in it is INCONCLUSIVE, not clean.
      - if: failure()
        run: node tools/scripts/lib/ci-test-digest.mjs "$RUNNER_TEMP/nx-test.log" --task-failed

      # The raw bytes. Named per job so a second upload in the same run
      # cannot collide with this one.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nx-test-log-main-gate-full
          path: ${{ runner.temp }}/nx-test.log
          retention-days: 7
          if-no-files-found: warn

      # PRODUCTION builds, named individually. A bare `nx run-many -t build`
      # once went green while BOTH Next production builds errored on a
      # misplaced `use client`, and `docs` has no `production` configuration.
      # This is the non-negotiable: a gate that skips the production build has
      # historically let a broken build reach production.
      - run: npx nx run console:build:production
      - run: npx nx run tenant:build:production
      - run: npx nx run docs:build

  # -------------------------------------------------------------------------
  # THE RED SINK
  # -------------------------------------------------------------------------
  # A failing workflow emails whoever is watching, and an email is exactly the
  # thing that scrolled away and let failures sit on main for hours. So the
  # verdict also lands as a STATE: a commit status on the SHA that was gated,
  # visible beside that commit in the branch and commit views, persisting until
  # something supersedes it.
  #
  # tools/scripts/gate-report.mjs owns the decision so it can be self-tested.
  # Two things it gets right that inline YAML got wrong: a job that SKIPPED its
  # steps reports `success`, and reading that as green would clear a red on a
  # `main` nobody is pushing to; and `fast` and `full` write SEPARATE contexts,
  # so a cheap green cannot overwrite an expensive red.
  report:
    name: report
    runs-on: ubuntu-latest
    needs: [fast, full]
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read
      statuses: write
    steps:
      # fetch-depth: 0 — the summary lists the commits this verdict covers, and
      # a default shallow checkout is depth 1, so `git log --since` would have
      # reported exactly one commit however wide the window really was.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verdict -> commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node tools/scripts/gate-report.mjs \
            --sha "${{ needs.fast.outputs.sha || github.sha }}" \
            --fast "${{ needs.fast.result }}" \
            --fast-verified "${{ needs.fast.outputs.verified }}" \
            --full "${{ needs.full.result }}" \
            --full-verified "${{ needs.full.result != 'skipped' }}"

      # The suspect list. Its length is the whole argument for gating on a short
      # timer: a day of accumulated commits is not a suspect list, an hour of
      # them is.
      - if: always()
        run: |
          {
            echo "### main gate"
            echo
            echo "| job | result | verified |"
            echo "|---|---|---|"
            echo "| fast | ${{ needs.fast.result }} | ${{ needs.fast.outputs.verified }} |"
            echo "| full | ${{ needs.full.result }} | ${{ needs.full.result != 'skipped' }} |"
            echo
            echo "Gated \`$(git rev-parse --short HEAD)\`. Commits in this window:"
            echo
            git log --since='70 minutes ago' --format='- `%h` %s (%an)' || true
          } >> "$GITHUB_STEP_SUMMARY"
