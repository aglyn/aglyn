name: Main Gate

# ---------------------------------------------------------------------------
# CONTINUOUS GATING OF `main` (AGL-2486)
# ---------------------------------------------------------------------------
# On 2026-08-22 the promotion gate came back RED with four unrelated failures —
# a spec-tsconfig type error, a banned word in a new fixture, a latent raw NUL
# byte, and a stale generated pricing table. All four had been sitting on `main`
# for hours. The cost was not the gate's 15 minutes; it was that a promotion
# turned into an unbounded repair session, at the one moment when the answer
# was supposed to be yes or no.
#
# The reason nothing caught them earlier is recorded in nx-ci.yml and
# tools-guards.yml: on 2026-08-20 the `push` trigger on both moved from `main`
# to `production`, because with many agents landing on `main` continuously they
# ran dozens of times an hour and every red raised a notification. CI became
# noise, so it was switched off for `main`, and the note left behind says what
# then happened — "a break can sit on `main` unnoticed until someone runs the
# gate."
#
# This workflow gates `main` on every push without restoring that noise:
#
#   - The verdict lands as a COMMIT STATUS on the gated SHA (see `statuses:
#     write` below for why it is not a tracking issue). A break is therefore a
#     visible STATE rather than an email that scrolls away.
#   - An alert is sent once per DISTINCT red: the same sha failing the same way
#     is recorded and never repeated (AGL-2537).
#   - The full sweep grades the newest push, so a burst of commits costs one
#     sweep and one full verdict (AGL-2836).
#
#     ⚠️ A status ALONE is a state nobody is notified of, and that was
#     a real gap rather than a nuance (AGL-2533). A status sits on a sha the
#     branch has already moved past, so a red was only ever found by someone
#     who went looking at that sha. Two reds went unread for hours on
#     2026-09-03 — a linear-id ceiling violation and a genuine 429-vs-200
#     assertion failure — and the second was misread as an already-explained
#     flake because nothing surfaced it. The report jobs ALERT on a red:
#     Slack `#ci` is the notification, and the status is the durable record.
#
# ---------------------------------------------------------------------------
# WHY TWO HALVES
# ---------------------------------------------------------------------------
# `fast` is typecheck + docs:typecheck + every derived guard. It finishes in
# about ten minutes and grades every pushed commit, so a type or guard break
# names its own commit.
#
# `full` is lint, the tests in four shards and the three PRODUCTION builds, in
# `main-gate-full.yml`. It runs on every push as ONE unit behind ONE queue: a
# sweep runs, a push that lands meanwhile waits, and only the newest waiting
# push is kept (AGL-2836). Debounced to one sweep an hour (AGL-2552), it left
# the 24 test, lint and build breaks of 2026-09-03 to 2026-09-11 on `main` a
# median 43 minutes before their first red.
#
# ⚑ Cadences were once written here as crons, and they were fiction: GitHub
# delivered 13 of 120 quarter-hourly runs and 6 of 24 hourly ones. Do not
# describe a cadence in this file without measuring the delivered one.
#
# The split is not a guess about which half matters. ALL FOUR of the 2026-08-22
# failures were in the `fast` half — one typecheck, three guards — and from
# 2026-09-03 to 2026-09-11 the halves caught 20 and 24 breaks. Neither half
# replaces `tools/gate.sh`, which is what a promotion runs; they keep `main` in a
# state where running it is uneventful.

on:
  # THE PRIMARY TRIGGER. The event that can break `main` is a push to `main`, so
  # that is what gates it. GitHub delivered 13 of 120 requested cron runs when
  # this was measured on 2026-09-03, so the crons below are backstops.
  #
  # ⚑ This does NOT restore the noise that moved `nx-ci.yml`'s push trigger off
  # `main` for the Sept-1 freeze. That workflow notifies on every red; this one
  # alerts once per DISTINCT red and writes a commit status besides.
  push:
    branches:
      - main
  schedule:
    # Every 15 minutes, offset off :00 — GitHub's scheduler is most congested
    # on the hour and schedules are best-effort, so a run may be late or
    # skipped entirely (measured: 11% delivered). A BACKSTOP for the fast half;
    # `tools/gate.sh` at promotion time remains the guarantee.
    - cron: '7,22,37,52 * * * *'
    # Hourly, offset again. Re-sweeps the tip of a quiet `main`, which is also
    # what finds a spec that fails on the clock rather than on a commit.
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full sweep (tests + production builds)'
        type: boolean
        default: true
      test_notification:
        description: 'Send a TEST alert down the real notification path'
        type: boolean
        default: false


env:
  NX_NO_CLOUD: 'true'

permissions:
  contents: read
  # The `moved` step asks the Actions API for the last completed run's head_sha
  # so a quiet weekend does not re-gate the same commit 96 times a day. That
  # read needs `actions: read` — without it `gh api` 403s. The step degrades
  # safely (it falls back to running the gate rather than skipping it), so the
  # failure mode is wasted minutes, not a missed verdict; granting it makes the
  # skip actually work.
  actions: read
  # The verdict lands as a COMMIT STATUS on the gated SHA. It was written as a
  # tracking issue first; that cannot work here and it took one API call to
  # find out — `gh api repos/aglyn/aglyn` returns has_issues:false and
  # has_discussions:false, so every red would have died at `gh issue create`
  # and looked like a broken step rather than a missing verdict.
  statuses: write

jobs:
  fast:
    name: fast (typecheck + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PER-JOB concurrency, not per-workflow, and the difference is the whole
    # 15-minute cadence. A workflow-level group put `fast` and `full` in ONE
    # group, so every quarter-hourly fast run queued behind the HOURLY full
    # sweep — observed live: run 32626327444's fast finished at 07:47 while its
    # full ran on, and the next three fast runs sat pending behind it. The job
    # sized to catch a break within 15 minutes was silently throttled to
    # hourly, which is the one property it exists to provide.
    #
    # NOT cancel-in-progress. AGL-2378's finding still applies: a group holds
    # one running plus at most one pending run, so a third arrival drops the
    # pending one. That is correct for a timer — a superseded scheduled run
    # covers a range the next run also covers — and wrong for a push, where
    # each commit needs its own verdict.
    #
    # So a push gets its OWN group, keyed by its commit, exactly as
    # `nx-ci.yml` does for the same reason: a fixed group holds one running
    # plus one pending, and a third arrival drops the pending one. With four
    # sessions landing on `main` that would silently discard verdicts for the
    # middle commits of every burst — the failure this trigger exists to end.
    # Timer runs keep sharing one group, which is correct for them: a
    # superseded scheduled run covers a range the next one also covers.
    concurrency:
      group: main-gate-fast-${{ github.event_name == 'push' && github.sha || 'timer' }}
      cancel-in-progress: false
    outputs:
      # Whether this job actually ran its checks. A job that skipped every step
      # still reports `success`, so the report job cannot infer this from the
      # result and must be told.
      verified: ${{ steps.moved.outputs.skip != 'true' }}
      sha: ${{ steps.moved.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Has `main` moved since the last run that produced a verdict? If not,
      # re-running proves nothing new and re-notifies on a red that is already
      # tracked. Cheap to ask, and it keeps a quiet weekend from burning 96
      # runner-hours a day.
      - id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(git rev-parse HEAD)
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/main-gate.yml/runs?status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.name=="Main Gate")][0].head_sha' 2>/dev/null || echo '')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$last" ] && [ "$last" = "$current" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "main has not moved since $last — nothing new to gate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.moved.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # The three trees, for the same reasons nx-ci.yml enumerates: neither
      # apps/docs nor cloud/functions is an npm workspace, and a root-only
      # install fails docs:typecheck and cloud-functions with errors that read
      # as source defects.
      - id: install
        if: steps.moved.outputs.skip != 'true'
        run: npm ci
      - id: install-functions
        if: steps.moved.outputs.skip != 'true'
        run: npm ci --prefix cloud/functions
      - id: install-docs
        if: steps.moved.outputs.skip != 'true'
        run: npm ci --prefix apps/docs

      # `TYPECHECK_CONCURRENCY` because this runner has 4 vCPU and 16 GB, and
      # the script's own sizing reads only the FIRST of those (AGL-2684). It
      # picks its worker count from `cores - loadavg()`, which on an idle
      # 4-core runner is 4 every time — and four `@typescript/native` programs
      # for apps/console, apps/tenant, cloud/functions and libs/aglyn are
      # resident together in the first wave, because those four are what the
      # workers reach for once the two trivial console-e2e configs clear in
      # under a second. In the green runs that wave is a 69-second gap with no
      # output; in the red ones the job is SIGTERM'd inside it, 66-80s in,
      # with no `error TS` anywhere and two or three live `tsc` processes left
      # to be reaped as orphans. CPU headroom cannot see a memory ceiling, so
      # the load average reads the same on both.
      #
      # nx-ci.yml runs these same 145 configs without this because it shards
      # them across three runners (AGL-2505), which puts the heavy four on
      # different machines. This job compiles the whole workspace on one, so
      # the budget has to be stated here.
      - if: steps.moved.outputs.skip != 'true'
        env:
          TYPECHECK_CONCURRENCY: '2'
        run: npm run typecheck
      # The docs typecheck and the guards run whatever the workspace typecheck
      # concluded, provided the installs they read succeeded (AGL-2835). A step's
      # default condition is `success()`, under which one type error skips every
      # guard: 22 fast runs from 2026-09-03 to 2026-09-11 ran none, so a guard
      # break that landed during a type error stayed unseen until the type error
      # was fixed. The job is red either way; the verdict covers both classes.
      - if: ${{ !cancelled() && steps.moved.outputs.skip != 'true' && steps.install.outcome == 'success' && steps.install-functions.outcome == 'success' && steps.install-docs.outcome == 'success' }}
        run: npx nx run docs:typecheck

      # All of them, concurrently. The list is DERIVED from nx-ci.yml and
      # tools-guards.yml by the script itself, so a guard added to either is
      # gated here without anyone editing this file — and deriving zero is a
      # hard failure rather than an empty green phase.
      - if: ${{ !cancelled() && steps.moved.outputs.skip != 'true' && steps.install.outcome == 'success' && steps.install-functions.outcome == 'success' && steps.install-docs.outcome == 'success' }}
        run: node tools/scripts/run-guards.mjs --concurrency 4
        # `check:linear-ids` is one of the guards derived above, and it asks
        # Linear for the highest issue that exists — an answer that can only
        # ever RAISE its checked-in floor (AGL-2670). Without the key it reds
        # on a citation of any issue filed since the floor was last edited,
        # which is bookkeeping rather than a defect. Fails soft in every
        # direction, so the guard still runs, and still refuses a fabricated
        # id, wherever the secret is empty.
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}

      # Which commits this verdict covers. On a red, this is the suspect list,
      # and its length is the whole point of gating on a short timer: a day's
      # accumulation is not a suspect list, fifteen minutes of it is.
      - if: always() && steps.moved.outputs.skip != 'true'
        run: |
          {
            echo "### Commits in this window"
            echo
            git log --since='20 minutes ago' --format='- \`%h\` %s (%an)' || true
            echo
            echo "Gated \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # IS THE FULL SWEEP DUE? (AGL-2552, AGL-2836)
  #
  # A push always is; a dispatch asks with its `full` input; of the two crons,
  # only the hourly one is. The rule lives in `lib/main-gate-full-sweep.mjs`,
  # where it is tested, because logic inline in a workflow can only be tested by
  # running the workflow. No install and no network: a sparse checkout, seconds.
  sweep-due:
    name: is the full sweep due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.decide.outputs.due }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/scripts
          sparse-checkout-cone-mode: false
      - id: decide
        env:
          MAIN_GATE_SCHEDULE: ${{ github.event.schedule }}
          MAIN_GATE_INPUTS_FULL: ${{ inputs.full }}
        run: node tools/scripts/check-main-gate-full-sweep.mjs

  # THE FULL SWEEP, ONE UNIT BEHIND ONE QUEUE (AGL-2836)
  #
  # The concurrency group sits on this CALLER, so the whole of
  # `main-gate-full.yml` is what queues. `cancel-in-progress: false` holds one
  # running sweep and one waiting sweep per ref: a newer push replaces the
  # waiting one, which ends `cancelled` and writes no status, and a running
  # sweep is never cut off. Replayed over the pushes of 2026-09-04 to
  # 2026-09-11 with an 11-minute sweep, a push waited a median 12 and at most 22
  # minutes for a sweep covering it. Cancelling the running sweep instead gave a
  # max of 45, because it grades nothing until a burst ends.
  #
  # Per-job groups inside the called workflow would not be one unit: a typecheck
  # group and a test group turn over at different times, so a burst would leave
  # runs with some parts cancelled and no run with all of them.
  #
  # Keyed on the ref, so a sweep dispatched on a branch never queues with, or
  # displaces, the sweep of `main`.
  full:
    name: full sweep
    needs: sweep-due
    if: needs.sweep-due.outputs.due == 'true'
    concurrency:
      group: main-gate-full-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/main-gate-full.yml
    secrets: inherit

  # -------------------------------------------------------------------------
  # THE VERDICTS, AND THE ALERTS THAT CARRY THEM
  # -------------------------------------------------------------------------
  # A failing workflow emails whoever is watching, and an email is exactly the
  # thing that scrolled away and let failures sit on main for hours. So each
  # verdict also lands as a STATE: a commit status on the SHA that was gated,
  # visible beside that commit in the branch and commit views, persisting until
  # something supersedes it.
  #
  # tools/scripts/gate-report.mjs owns the decision so it can be self-tested.
  # Two things it gets right that inline YAML got wrong: a job that SKIPPED its
  # steps reports `success`, and reading that as green would clear a red on a
  # `main` nobody is pushing to; and `fast` and `full` write SEPARATE contexts,
  # so a cheap green cannot overwrite an expensive red.
  #
  # One report job per half, so the fast verdict and its alert never wait on a
  # sweep that may be queued behind another (AGL-2836).
  report-fast:
    name: report · fast
    runs-on: ubuntu-latest
    needs: [fast]
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read
      statuses: write
    steps:
      # fetch-depth: 0 — the summary lists the commits this verdict covers, and
      # a default shallow checkout is depth 1, so `git log --since` would have
      # reported exactly one commit however wide the window really was.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: verdict -> commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node tools/scripts/gate-report.mjs \
            --sha "${{ needs.fast.outputs.sha || github.sha }}" \
            --fast "${{ needs.fast.result }}" \
            --fast-verified "${{ needs.fast.outputs.verified }}"

      # THE NOTIFICATION (AGL-2533). The commit status above is correct,
      # precise, and attached to a sha the branch has already moved past —
      # which is why two real reds went unread for hours on 2026-09-03 while
      # four promotions went out. This sends the red to Slack `#ci`, which is
      # the only channel it goes to.
      #
      # `GITHUB_TOKEN` is what makes the alert idempotent: the reporter records
      # each red it sends as a commit status on the graded sha and skips a red
      # already recorded there. Absent the token the reporter still alerts,
      # because a duplicate is better than a miss.
      #
      # `always()` and the script's own exit-0 discipline are both deliberate —
      # a gate that failed BECAUSE it could not report would be strictly worse
      # than the silence it replaces. Only from `main`: a sweep dispatched on a
      # branch is a proof run, and its red is not `main`'s.
      - name: red -> Slack
        if: always() && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node tools/scripts/report-main-gate-red.mjs \
            --sha="${{ needs.fast.outputs.sha || github.sha }}" \
            --fast="${{ needs.fast.result }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --subject="$(git log -1 --format=%s || true)"

      # Proving the notifier without waiting for a failure (AGL-2533). A
      # notification path whose only test is a real incident is unverifiable
      # until the day it matters, which is the shape this issue is about. This
      # sends a clearly-labelled message through the real secrets and the real
      # code, on demand.
      # A TEST is deliberately given no token: it must never be deduped, and it
      # must never leave a record, because that record is keyed on the sha and
      # failing set it was invoked with and would afterwards swallow a REAL red
      # matching them as a duplicate of a message that said nothing was wrong.
      - name: TEST the notification path
        if: github.event_name == 'workflow_dispatch' && inputs.test_notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          node tools/scripts/report-main-gate-red.mjs --test \
            --sha="${{ github.sha }}" \
            --fast=failure \
            --full=skipped \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --subject='TEST of the notification path - not a real failure'

      # The suspect list for a fast red: the commits of the last twenty minutes.
      - if: always()
        run: |
          {
            echo "### main gate · fast"
            echo
            echo "| job | result | verified |"
            echo "|---|---|---|"
            echo "| fast | ${{ needs.fast.result }} | ${{ needs.fast.outputs.verified }} |"
            echo
            echo "Gated \`$(git rev-parse --short HEAD)\`. Commits in the last 20 minutes:"
            echo
            git log --since='20 minutes ago' --format='- `%h` %s (%an)' || true
          } >> "$GITHUB_STEP_SUMMARY"

  report-full:
    name: report · full
    runs-on: ubuntu-latest
    # `sweep-due` is needed for its RESULT, not its output: `full` depends on
    # it, so a failed `sweep-due` leaves `full` skipped — and a skipped `full`
    # is not a red. Without this the sweep would stop running on every push
    # while the reporter said "nothing to report" (AGL-2552).
    needs: [full, sweep-due]
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A sweep that a newer push replaced ends `cancelled`, which gate-report
      # reads as inconclusive and writes no status for, so the previous verdict
      # on `main` stands until the newest sweep finishes.
      - name: verdict -> commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node tools/scripts/gate-report.mjs \
            --sha "${{ github.sha }}" \
            --full "${{ needs.full.result }}" \
            --full-verified "${{ needs.full.result != 'skipped' }}"

      # The same notifier as `report-fast`, for the same reasons, and only from
      # `main`.
      - name: red -> Slack
        if: always() && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node tools/scripts/report-main-gate-red.mjs \
            --sha="${{ github.sha }}" \
            --full="${{ needs.full.result }}" \
            --sweep-due="${{ needs.sweep-due.result }}" \
            --run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --subject="$(git log -1 --format=%s || true)"

      - if: always()
        run: |
          {
            echo "### main gate · full"
            echo
            echo "| job | result |"
            echo "|---|---|"
            echo "| sweep-due | ${{ needs.sweep-due.result }} |"
            echo "| full | ${{ needs.full.result }} |"
            echo
            echo "Swept \`$(git rev-parse --short HEAD)\`. Commits in the last 30 minutes:"
            echo
            git log --since='30 minutes ago' --format='- `%h` %s (%an)' || true
          } >> "$GITHUB_STEP_SUMMARY"
