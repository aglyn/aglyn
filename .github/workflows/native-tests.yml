name: Native tests

# AGL-3704. The Kotlin and Swift tests of the native apps (Aglyn and Aglyn POS
# on Android, the JVM desktop, iOS and macOS) ran nowhere in CI, so main's
# native tests broke three times without a red: ListQueryCasesTest's maps, the
# 255-slot ContractValues class (AGL-3703) and duplicate kit types.
#
# TWO REQUIRED CHECKS, AND A JOB THAT DECIDES FOR THEM
#   `native changes`  ubuntu: asks `tools/scripts/native-ci-changed.mjs`
#                     whether anything Kotlin-relevant and anything
#                     Swift-relevant changed: a PR's own change (its test
#                     merge against the base it was merged onto), a push's
#                     `before`, or a dispatch's `base`. An unknown base answers
#                     "both".
#   `native kotlin`   ubuntu: every module's `desktopTest`, plus the Android
#                     sources of both apps compiled (`compileDebugKotlin`).
#   `native swift`    every Swift test target in the repository built ONCE and
#                     run (tools/scripts/native-swift-tests.mjs, which also
#                     compiles the generated plugin manifest in the same
#                     graph), then `xcodebuild build` of Aglyn and AglynPOS for
#                     macOS.
#
# THEY ALWAYS REPORT, AND MOSTLY PASS IN SECONDS (AGL-3783)
#   Both check names are required on `main` and `production`, and a required
#   check that never reports blocks the PR forever, so there is no `paths:`
#   filter and neither job is ever skipped. When its side did not change, a job
#   runs one echo and ends SUCCESS, which is what branch protection and
#   auto-merge-green.yml read. `native swift` picks its runner from the answer:
#   macOS only when something Swift changed. macOS runners are the scarce pool
#   (five at a time on this plan), and a PR that changes nothing Swift must
#   never wait for one. If `native changes` itself fails, both jobs still run,
#   and run everything: its outputs are empty, and empty is not "false".
#
# THE SWIFT BUILD IS CACHED, FROM MAIN (AGL-3783)
#   One cache entry holds the SwiftPM scratch path, the xcodebuild DerivedData
#   and the compiled package manifests (1.7 GB compressed), keyed by Xcode and
#   the runner image. A run on `main` saves it under its own sha: a push, or
#   the dispatch auto-merge-green.yml sends after it merges (a merge made with
#   GITHUB_TOKEN starts no push run). A PR restores main's newest, so it
#   recompiles only what differs from that commit. A PR never saves: its entry
#   is readable by that PR alone, and on 2026-10-14 five PR entries filled the
#   repository's 10 GB of cache within an hour and evicted the rest, the
#   entries PRs restore included. For a restored build to be reusable, every
#   tracked file is first stamped with a modification time derived from its
#   content (`native-swift-tests.mjs mtimes`): a fresh checkout otherwise dates
#   every file "now", and both build systems would recompile everything.

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:
    inputs:
      base:
        description: 'Run only what changed since this commit. Empty runs everything.'
        required: false
        default: ''

concurrency:
  # A PR's re-push supersedes its running check. A push is never cancelled
  # mid-run: main's run is the one that saves the warm Swift build every PR
  # restores, and a run cancelled by the next merge (every run, at main's pace)
  # saves nothing. GitHub keeps one pending run per group, so a burst of
  # merges runs the newest, not each one.
  group: native-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: native changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kotlin: ${{ steps.changed.outputs.kotlin }}
      swift: ${{ steps.changed.outputs.swift }}
    steps:
      # Full history so the base is reachable, without blobs: the diff reads
      # trees only, and the working tree's blobs come with the checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # A PR is checked out as GitHub's test merge, so its own change is the
      # merge against its first parent: the base it was merged onto.
      # `pull_request.base.sha` is not that commit. It can lag the base the
      # merge was made on, and then the diff also carries everything merged
      # to main in between, which sent web-only PRs to macOS whenever main had
      # just taken a native change.
      - name: Did anything native change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before || inputs.base }}
        run: |
          base=$BASE
          if [ "$EVENT" = pull_request ]; then base=$(git rev-parse --verify --quiet 'HEAD^1' || true); fi
          node tools/scripts/native-ci-changed.mjs --base "$base" --head HEAD

  kotlin:
    name: native kotlin
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN: ${{ needs.changes.outputs.kotlin != 'false' }}
    steps:
      - name: Nothing Kotlin changed
        if: env.RUN != 'true'
        run: echo "No Kotlin-relevant change since the base; nothing to build."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      - uses: actions/setup-java@v6
        if: env.RUN == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Every module's JVM desktop tests, then the Android sources of both
      # apps (and through them every Android library and plugin module).
      # compileDebugKotlin is the cheapest task that compiles them: no dexing,
      # no packaging. Gradle installs the SDK platform it needs.
      - name: Gradle desktopTest + Android compile
        if: env.RUN == 'true'
        working-directory: apps/android
        run: ./gradlew --no-daemon --continue desktopTest :app:compileDebugKotlin :pos:compileDebugKotlin

      - name: Test reports
        if: failure() && env.RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: native-kotlin-test-reports
          path: |
            apps/android/**/build/reports/tests/
            libs/native/kotlin/**/build/reports/tests/
            libs/plugins/*/src/android/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  swift:
    name: native swift
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.swift != 'false' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      RUN: ${{ needs.changes.outputs.swift != 'false' }}
      # The Swift Build engine, which Xcode 27's SwiftPM uses by default and
      # older images' SwiftPM does not. The native engine copies a symlinked
      # resource (contracts.generated.json links to libs/native/contracts) as
      # the link itself, which dangles inside the bundle, so every test that
      # reads the contracts traps. It also gives each test target its own
      # bundle and process.
      SPM_BUILD_SYSTEM: swiftbuild
    steps:
      - name: Nothing Swift changed
        if: env.RUN != 'true'
        run: echo "No Swift-relevant change since the base; nothing to build, and no macOS runner taken."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      # The newest Xcode on the image: the apps are developed on the current
      # release, and an older one may lack an SDK the sources use.
      - name: Select Xcode
        id: xcode
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          best='' best_version=''
          for app in /Applications/Xcode*.app; do
            [ -f "$app/Contents/version.plist" ] || continue
            [ -L "$app" ] && continue
            version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/version.plist")
            echo "$app $version"
            if [ -z "$best_version" ] || [ "$(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -1)" = "$version" ]; then
              best=$app best_version=$version
            fi
          done
          sudo xcode-select -s "$best"
          xcodebuild -version
          swift --version
          # A build from another compiler is useless, so the cache key names it,
          # and the runner image: a new image's SDK and toolchain files are new
          # files, so a build from another image recompiles much of itself.
          echo "version=$best_version-$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # Content-derived modification times (see the header), and XCBuild told
      # to compare files by them rather than by inode, which a restore changes.
      - name: Stamp the checkout for an incremental build
        if: env.RUN == 'true'
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          node tools/scripts/native-swift-tests.mjs mtimes

      # Same Xcode and image first; failing that, same Xcode on another image
      # (during an image rollout), which still saves resolving the packages.
      # The compiled Package.swift manifests are cached too: compiling the
      # nineteen of them took a minute on every run without it.
      - name: Restore the Swift build
        id: swift-cache
        if: env.RUN == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/spm-scratch
            ${{ runner.temp }}/DerivedData
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: native-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.image }}-${{ github.sha }}
          restore-keys: |
            native-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.image }}-
            native-swift-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-

      - name: swift test (every package's test targets, built once) + the plugin manifest
        if: env.RUN == 'true'
        run: >-
          node tools/scripts/native-swift-tests.mjs run
          --umbrella "$RUNNER_TEMP/swift-tests-umbrella"
          --scratch "$RUNNER_TEMP/spm-scratch"
          --build-system "$SPM_BUILD_SYSTEM"

      # Coverage is off for both schemes, so the two builds share every package.
      # Neither app has a shared scheme, and Xcode's generated `Aglyn` scheme
      # builds with coverage where `AglynPOS`'s does not: the swiftc lines of
      # one package target differ between the two builds by exactly
      # `-profile-generate -profile-coverage-mapping`. Both builds write the
      # same intermediates, so each threw the other's away: AglynPOS
      # recompiled all ~650 package files right after Aglyn had, and the next
      # run's Aglyn recompiled them again from the POS-shaped cache. This is a
      # build, not a test run, so nothing reads the coverage.
      # `CLANG_COVERAGE_MAPPING` is the setting both the Swift and the clang
      # flags hang off; `-enableCodeCoverage NO` is refused outside `test`.
      #
      # The full log goes to a file. What is printed: how many tasks of each
      # kind ran (a warm build should compile next to nothing, so this is
      # where a cache that stopped working shows), the timing summary, every
      # distinct error and warning, and on failure the end of the log.
      - name: xcodebuild Aglyn and AglynPOS (macOS)
        if: env.RUN == 'true'
        run: |
          set -euo pipefail
          for scheme in Aglyn AglynPOS; do
            echo "::group::xcodebuild $scheme"
            log="$RUNNER_TEMP/xcodebuild-$scheme.log"
            status=0
            xcodebuild build \
              -project apps/ios/Aglyn.xcodeproj \
              -scheme "$scheme" \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -skipPackagePluginValidation \
              -showBuildTimingSummary \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CLANG_COVERAGE_MAPPING=NO \
              > "$log" 2>&1 || status=$?
            echo "tasks run:"
            grep -oE '^(SwiftCompile|SwiftEmitModule|SwiftDriver|CompileC|Ld|Libtool|ProcessXCFramework|CopySwiftLibs|PhaseScriptExecution|ScanDependencies|PrecompileModule) ' "$log" | sort | uniq -c || true
            sed -n '/Build Timing Summary/,$p' "$log" | head -40
            grep -E ': (error|warning): ' "$log" | sort -u | head -300 || true
            echo "::endgroup::"
            if [ "$status" != 0 ]; then
              tail -80 "$log"
              echo "::error::xcodebuild $scheme failed (exit $status)"
              exit "$status"
            fi
          done

      # Only a run on a branch saves, each under its own sha (the oldest are
      # evicted first); see the header for why a PR never does. The git
      # mirrors are left out: the checkouts beside them are what a build reads.
      - name: Trim the Swift build for the cache
        id: save
        if: >-
          ${{ !cancelled() && env.RUN == 'true' && steps.swift-cache.outcome == 'success'
          && github.event_name != 'pull_request' }}
        run: |
          rm -rf "$RUNNER_TEMP/spm-scratch/repositories" "$RUNNER_TEMP/DerivedData/SourcePackages/repositories" "$RUNNER_TEMP/DerivedData/Logs"
          du -sh "$RUNNER_TEMP/spm-scratch" "$RUNNER_TEMP/DerivedData" || true

      - name: Save the Swift build
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/spm-scratch
            ${{ runner.temp }}/DerivedData
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
