# Dependabot version updates (AGL-2058).
#
# Before this file the repo had `dependabot_security_updates: enabled` and
# nothing else, which is alert-driven only: GitHub opens a PR once a package
# has a PUBLISHED advisory and a reachable fix. Ordinary "bump X from 1.2.3 to
# 1.2.4" PRs need this file, so routine drift was invisible until it turned
# into a CVE. That is exactly how AGL-2051 happened — `monaco-editor` sat on
# 0.55.1 carrying a vendored DOMPurify 3.2.7 through eighteen successive
# advisories, when a routine 0.55.1 -> 0.56.0 bump would have arrived on its
# own and none of them would have accumulated.
#
# THE ECOSYSTEMS BELOW ARE ENUMERATED FROM WHAT IS ON DISK, not guessed:
#
#   npm             /                    package-lock.json  (201 deps)
#   npm             /apps/docs           package-lock.json  (Docusaurus site)
#   npm             /cloud/functions     package-lock.json  (Cloud Functions)
#   github-actions  /                    .github/workflows/*.yml (11 workflows)
#   docker          /docker              console.Dockerfile, tenant.Dockerfile
#
# There is no yarn.lock, pnpm-lock.yaml, Gemfile.lock, go.sum, Cargo.lock or
# requirements.txt anywhere outside node_modules, and the root package.json
# declares no `workspaces` — so /apps/docs and /cloud/functions really are
# three separate installs, not one tree seen three times.
#
# `docker-compose.yml` is deliberately NOT an entry: every service in it is
# `build:` from the two Dockerfiles above. It pins no `image:`, so there is
# nothing there for Dependabot to update, and the `/docker` entry already
# covers the base images those builds use.
#
# NOTHING HERE EDITS A LOCKFILE BY HAND. Dependabot regenerates the lockfile
# with the real package manager on its own branch. A blanket textual rewrite
# of a lockfile once produced an unregistered scope in this repo — a
# dependency-confusion hazard — which is why lockfile edits only ever happen
# through the tool that owns the file.
#
# FLOOD CONTROL, because this switches on ten days before the September 1
# public beta:
#
#  - Weekly on SATURDAY, never monthly. `interval: monthly` fires on the 1st,
#    and September 1 is launch day; a burst of dependency PRs is the last
#    thing that morning needs.
#  - Grouped. 201 root dependencies ungrouped is ~40 PRs. Grouped it is at
#    most one PR per family per week.
#  - `open-pull-requests-limit` is low everywhere (4 root, 1-2 elsewhere), so
#    the ceiling on open Dependabot PRs across the whole repo is 11 and in
#    practice far fewer. Raise these AFTER launch, once someone has time to
#    merge them.
#
# The lockstep groups (nx, next+react, mui+emotion, firebase, jest) are not
# cosmetic: those families must move together or the build breaks, so a
# per-package PR for one of them would be red on arrival.

version: 2

updates:
  # ── npm: the Nx monorepo root ──────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 4
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # `typescript` is an npm ALIAS here — package.json pins
      # `npm:@typescript/typescript6@6.0.2`. Dependabot resolves the alias
      # name rather than the target and would propose a bump to the wrong
      # package. Remove this entry when the pin becomes a plain version.
      - dependency-name: typescript
      # @base-ui/react >= 1.7.0 cannot pass the console suite. 1.7.0 added
      # utils/dispatchClickWithModifiers.js (absent in 1.6.0), which on keydown
      # synthesises the click via `new (ownerWindow(el).PointerEvent)(...)`.
      # jest does not run in the repo's jsdom 29 — jest-environment-jsdom pins
      # its own nested jsdom 26.1.0, which has NO PointerEvent — so every
      # keyboard-activated base-ui button throws "PointerEvent is not a
      # constructor". Browser and production builds are unaffected; it is the
      # test environment alone. Patch releases of the 1.6 line still arrive.
      # Remove this together with the jest PointerEvent polyfill. (AGL-2470)
      - dependency-name: '@base-ui/react'
        versions:
          - '>=1.7.0'
      # Babel 8 cannot land while nx is on Babel 7. @nx/js depends on
      # `@babel/core: ^7.23.2`, and @nx/next/babel — the preset
      # apps/console/jest.config.ts runs every spec through — resolves through
      # it. 116 packages in the tree require a ^7 core, and
      # @babel/preset-react@8 peers on `@babel/core: ^8.0.0`, so the family
      # cannot be split either: taking core to 8 leaves the whole jest
      # transform pipeline on a peer-violating tree. Majors of the @babel/*
      # family therefore arrive unmergeable, one PR per package, every week.
      # Patch and minor bumps of the 7 line still arrive. Remove this once nx
      # ships a Babel 8 toolchain. (AGL-2478)
      - dependency-name: '@babel/*'
        update-types:
          - version-update:semver-major
    groups:
      # A dependency lands in the FIRST group whose patterns match, so the
      # order of these blocks is load-bearing: `eslint-config-next` belongs
      # with next/react, not with the linters, and is matched there first.
      nx-workspace:
        patterns:
          - nx
          - '@nx/*'
          - '@nrwl/*'
      next-react:
        patterns:
          - next
          - '@next/*'
          - eslint-config-next
          - react
          - react-dom
          - react-is
          - '@types/react'
          - '@types/react-dom'
          - '@types/react-is'
      mui-emotion:
        patterns:
          - '@mui/*'
          - '@emotion/*'
      firebase:
        patterns:
          - firebase
          - 'firebase-*'
          - '@firebase/*'
      jest:
        patterns:
          - jest
          - 'jest-*'
          - ts-jest
          - babel-jest
          - '@types/jest'
      linters:
        patterns:
          - eslint
          - 'eslint-*'
          # `typescript-eslint` is the UMBRELLA package for the scoped ones
          # below and re-exports the plugin, so the two must move together: on
          # a version skew eslint registers the @typescript-eslint plugin twice
          # and refuses the config outright with `Cannot redefine plugin`,
          # killing the lint target rather than reporting a finding. It matches
          # none of the other patterns here — it is unscoped and does not start
          # with `eslint-` — so without this line it falls through to
          # dev-minor-patch and arrives in a DIFFERENT PR from its own
          # siblings, which is exactly how #881 and #879 came to disagree.
          # (AGL-2478)
          - typescript-eslint
          - '@typescript-eslint/*'
          - prettier
          - 'prettier-*'
      types:
        patterns:
          - '@types/*'
      # mobx and its React bindings must move as a PAIR: mobx-react-lite@5
      # declares `peerDependencies: { mobx: ^7.0.0 }` and mobx-react-lite@4
      # peers on ^6, so a bump to either one alone leaves the tree
      # peer-violating. Ungrouped they are two separate majors, which is
      # exactly how #888 (mobx 7) and #890 (mobx-react-lite 5) arrived — a
      # pair of PRs where merging either one on its own is wrong and merging
      # both means merging two conflicting lockfiles. `mobx-react` is listed
      # although nothing imports it today: it is the class-component half of
      # the same release train (MobX 7 shipped with mobx-react 10), so if it
      # is ever added it must already be in this group. (AGL-2480)
      mobx:
        patterns:
          - mobx
          - mobx-react
          - mobx-react-lite
      # @stripe/react-stripe-js pins @stripe/stripe-js by an EXACT major
      # window, so the two are locked together harder than a usual peer range:
      #   react-stripe-js v3/v4 -> stripe-js >=1.44.1 <8.0.0   (we are here)
      #   react-stripe-js v5    -> stripe-js >=8.0.0  <9.0.0
      #   react-stripe-js v6    -> stripe-js >=9.5.0  <10.0.0
      # There is no version of the bindings that spans two stripe-js majors,
      # so every stripe-js major REQUIRES a bindings major in the same commit.
      # #889 proposed stripe-js 9.13.0 against react-stripe-js 3.10.0, which
      # its own peer range forbids outright. Grouping them means the checkout
      # path is offered one coherent migration to gate, never a broken half.
      # (AGL-2480)
      stripe:
        patterns:
          - '@stripe/*'
      # Everything not named above, split by dependency type so a dev-tool
      # bump can be merged on sight while a production bump gets read. Both
      # are minor+patch only — a major of an ungrouped package arrives as its
      # own PR, which is the one case worth reading alone.
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  # ── npm: the Docusaurus documentation site ─────────────────────────────
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # apps/docs CANNOT go to TypeScript 7. It extends @docusaurus/tsconfig,
      # which still sets `baseUrl` — an option TS 7 removed — so `tsc` fails
      # parsing the CONFIG and never reads a source file:
      #   error TS5102: Option 'baseUrl' has been removed.
      # We set no compilerOptions of our own here, so there is nothing local to
      # fix; it needs Docusaurus to ship a tsconfig without baseUrl. This is
      # the AGL-2363 shape again — a config-level rejection that reads as a
      # broken build rather than as lost type coverage. Note this guards
      # something completely different from the root/functions `typescript`
      # ignores, which exist because those pin an npm ALIAS: do not remove
      # them together. 5.6.x patches still arrive. (AGL-2477)
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # react and react-dom must move as a PAIR: react-dom@19 declares
      # `peerDependencies: { react: ^19.2.8 }`, and the two share internals, so
      # a bump to one alone leaves the site on a mismatched major. A major sits
      # outside docs-minor-patch and would otherwise arrive as a lone
      # single-package PR — which is exactly how #878 turned up, bumping
      # react-dom to 19 while leaving react on 18. Grouping them means the pair
      # arrives as one reviewable React-19 migration or not at all. The root
      # config already does this with its next-react group. (AGL-2477)
      docs-react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - 'docusaurus-*'
          - '@easyops-cn/docusaurus-search-local'
          - '@mdx-js/*'
      docs-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  # ── npm: Cloud Functions (its own install, Node 22 runtime) ────────────
  - package-ecosystem: npm
    directory: /cloud/functions
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # THE SAME npm ALIAS THE ROOT ENTRY IGNORES. cloud/functions/package.json
      # pins `typescript` to `npm:@typescript/typescript6@6.0.2` exactly as the
      # root does, so Dependabot would resolve the alias name instead of the
      # target here too. The root was guarded and this manifest was not; it
      # simply had not misfired yet. Remove when the pin becomes a plain
      # version — in both places at once. (AGL-2458)
      - dependency-name: typescript
      # firebase-admin v14 CANNOT be installed here. firebase-functions-test
      # (devDependency) peers on ^8 || ^9 || ^10 || ^11 || ^12 || ^13 with no
      # ^14, and 3.5.0 is the latest release, so there is nothing to upgrade it
      # to; with admin ^14 `npm ci` dies on ERESOLVE. No workflow runs an
      # install in this directory, so CI would not catch it. Minor and patch
      # bumps of the v13 line still arrive. Drop this the moment
      # firebase-functions-test ships a peer range including ^14. (AGL-2457)
      - dependency-name: firebase-admin
        update-types:
          - version-update:semver-major
    groups:
      firebase:
        patterns:
          - 'firebase-*'
      functions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'

  # ── GitHub Actions used by the 11 workflows ────────────────────────────
  # A pinned action is a supply-chain surface that nothing else in this repo
  # watches: no lockfile records it and no install step re-resolves it, so a
  # `@v5` that stops being maintained simply keeps running.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  # ── Docker base images for the self-host build (AGL-905) ───────────────
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: saturday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Both Dockerfiles run `node:24-slim`, matching the Node 24 that Vercel
      # runs and the `engines.node: ">=24"` in package.json. A major bump is a
      # runtime decision to make deliberately in all three places at once, not
      # a PR to merge; patch/minor rebuilds of the 24 line still arrive.
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      base-images:
        patterns:
          - '*'
