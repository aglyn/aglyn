# The native Kotlin stack for Aglyn and Aglyn POS (Android + JVM desktop).
# One catalog for every module the Gradle root at apps/android includes.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-multiplatform = "1.12.1"
compose-material3 = "1.9.0"
compose-material3-adaptive = "1.3.0"
compose-material-icons = "1.7.3"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
jna = "5.19.1"
# Microsoft Edge WebView2 SDK (NuGet Microsoft.Web.WebView2): WebView2Loader.dll for the Windows Besigner.
webview2 = "1.0.4258.31"
grpc = "1.62.2"
protobuf = "3.25.5"
firestore-protos = "3.21.0"
androidx-activity = "1.13.0"
androidx-core = "1.19.1"
androidx-splashscreen = "1.2.0"
# Passkeys: the Credential Manager, with Google Play services as its provider on devices before Android 14.
androidx-credentials = "1.5.0"
# Sign in with Google through the Credential Manager ("Connect Google").
googleid = "1.1.1"
# The versions Firebase BoM 34.19.0 pins; KMP androidMain takes no platform().
firebase-auth = "24.2.0"
firebase-firestore = "26.6.0"
firebase-messaging = "25.1.3"
firebase-installations = "19.1.2"
firebase-appcheck = "19.4.1"
firebase-crashlytics = "20.1.1"
firebase-analytics = "23.2.0"
# The Crashlytics Gradle plugin: the build ids crash reports are matched by, and the R8 mapping upload (AGL-4067).
firebase-crashlytics-gradle = "3.0.8"
# Only for its GoogleServicesTask, which the Crashlytics plugin reads the Firebase app id from; the google-services plugin
# itself is never applied (Firebase is configured in code, no google-services.json in the repo).
google-services = "4.5.0"
# Google Play Integrity (approved 2026-10-15, AGL-3818): the attestation Firebase App Check's Android provider asks Play for.
play-integrity = "1.6.0"
# Stripe Terminal Android (Tap to Pay + Bluetooth readers), Aglyn POS only.
stripe-terminal = "5.8.2"
# The OkHttp Stripe Terminal is built against (its pom names 4.12.0; 6.0.0 too): its code calls okhttp3.internal.Util,
# which OkHttp 5 removed, so Aglyn POS pins OkHttp to this for its readers to connect (apps/android/pos/build.gradle.kts).
stripe-terminal-okhttp = "4.12.0"
# Stripe's card form (PaymentSheet) for a card typed in at the register, Aglyn POS only.
stripe-android = "23.21.0"
# Camera barcode scanning: CameraX preview + ML Kit's bundled barcode model.
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
junit = "4.13.2"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"

[libraries]
# Custom Tabs: Stripe's hosted Checkout and Customer Portal open in the secure in-app browser.
androidx-browser = { module = "androidx.browser:browser", version = "1.9.0" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
google-identity-googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
webview2-sdk = { module = "nuget.microsoft:microsoft.web.webview2", version.ref = "webview2" }
grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
firestore-protos = { module = "com.google.api.grpc:proto-google-cloud-firestore-v1", version.ref = "firestore-protos" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material3-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3" }
compose-material3-adaptive-layout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-navigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-material3-adaptive" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
# Not used directly: Firebase's play-services-basement still asks for fragment 1.1, and the
# Activity Result API (permission prompts) needs 1.3 or later, which release lint enforces.
androidx-fragment = { module = "androidx.fragment:fragment", version = "1.8.9" }
firebase-auth = { module = "com.google.firebase:firebase-auth", version.ref = "firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore", version.ref = "firebase-firestore" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
firebase-installations = { module = "com.google.firebase:firebase-installations", version.ref = "firebase-installations" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics", version.ref = "firebase-analytics" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity", version.ref = "firebase-appcheck" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }
stripe-terminal = { module = "com.stripe:stripeterminal", version.ref = "stripe-terminal" }
stripe-terminal-taptopay = { module = "com.stripe:stripeterminal-taptopay", version.ref = "stripe-terminal" }
stripe-paymentsheet = { module = "com.stripe:paymentsheet", version.ref = "stripe-android" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-camera-mlkit-vision = { module = "androidx.camera:camera-mlkit-vision", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-gradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
